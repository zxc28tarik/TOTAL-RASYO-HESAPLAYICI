name: V24 BIST100 Borsa Mirror Corpus

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-bist100-borsa-mirror-corpus.yml'

permissions:
  contents: read

jobs:
  borsa-mirror-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Match canonical index records to Borsa announcement mirrors
        run: |
          mkdir -p artifacts/pages
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time, unicodedata
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          BASE='https://borsaistanbul.com'
          INDEX_URL=BASE+'/en/indices/index-announcements'
          START=datetime.strptime('2021-06-01','%Y-%m-%d').date()
          END=datetime.strptime('2026-08-31','%Y-%m-%d').date()
          HEADERS={'User-Agent':'Mozilla/5.0 V24-historical-research/3.0'}

          def fetch(url):
              last=None
              for i in range(3):
                  try:
                      r=requests.get(url,headers=HEADERS,timeout=25)
                      r.raise_for_status()
                      return r.content,r.url
                  except Exception as exc:
                      last=exc; time.sleep(.5*(i+1))
              raise RuntimeError(f'fetch failed {url}: {last}')

          def norm(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+',' ',s).strip()

          raw_index,_=fetch(INDEX_URL)
          Path('artifacts/index_announcements.html').write_bytes(raw_index)
          soup=BeautifulSoup(raw_index,'html.parser')
          candidates=[]
          for tr in soup.find_all('tr'):
              text=' '.join(tr.stripped_strings)
              dm=re.search(r'\b(\d{2})\.(\d{2})\.(\d{4})\b',text)
              if not dm or 'Index Constituents Changes' not in text or 'Benchmark Indices' not in text:
                  continue
              day=datetime.strptime(dm.group(0),'%m.%d.%Y').date()
              if not (START<=day<=END): continue
              links=[a for a in tr.find_all('a',href=True) if 'javascript:' not in a['href'].lower()]
              if not links: continue
              link=max(links,key=lambda a:len(' '.join(a.stripped_strings)))
              title=' '.join(link.stripped_strings).strip()
              candidates.append({
                  'announcement_date':day.isoformat(),
                  'type':'PERIODIC' if '(Periodic)' in text else 'NON_PERIODIC',
                  'title':title,
                  'title_norm':norm(title),
                  'index_href':urljoin(INDEX_URL,link['href']),
                  'index_row_text':text,
              })

          # Build a Borsa-only announcement-link catalog. We intentionally do not
          # fetch KAP links here, so rate limiting at KAP cannot make the corpus partial.
          archive_links={}
          def scan_page(page):
              try:
                  raw,_=fetch(f'{BASE}/en/announcement?page={page}')
              except Exception as exc:
                  return page,[],repr(exc)
              s=BeautifulSoup(raw,'html.parser')
              rows=[]
              for a in s.find_all('a',href=True):
                  href=a['href']
                  if not re.search(r'/en/announcement/\d+/',href): continue
                  title=' '.join(a.stripped_strings).strip()
                  if not title: continue
                  rows.append((norm(title),title,urljoin(BASE,href)))
              return page,rows,None

          scan_errors=[]
          with ThreadPoolExecutor(max_workers=16) as pool:
              futs={pool.submit(scan_page,p):p for p in range(1,121)}
              for fut in as_completed(futs):
                  page,rows,err=fut.result()
                  if err: scan_errors.append({'page':page,'error':err}); continue
                  for key,title,url in rows:
                      archive_links.setdefault(key,[]).append({'title':title,'url':url})

          matched=[]; unmatched=[]
          for item in candidates:
              options=archive_links.get(item['title_norm'],[])
              if not options:
                  # fallback to strong token containment; never silently choose if ambiguous
                  tokens=set(item['title_norm'].split())
                  fuzzy=[]
                  for key,vals in archive_links.items():
                      kt=set(key.split())
                      if len(tokens)>=5 and len(tokens & kt) >= max(5,int(.8*len(tokens))):
                          fuzzy.extend(vals)
                  uniq={x['url']:x for x in fuzzy}
                  options=list(uniq.values())
              if len(options)==1:
                  matched.append({**item,'borsa_url':options[0]['url']})
              else:
                  unmatched.append({**item,'mirror_option_count':len(options),'mirror_options':options[:10]})

          def inspect(pair):
              i,item=pair
              raw,final=fetch(item['borsa_url'])
              digest=hashlib.sha256(raw).hexdigest()
              s=BeautifulSoup(raw,'html.parser')
              text='\n'.join(' '.join(x.split()) for x in s.stripped_strings)
              page_name=f"{item['announcement_date']}_{i:04d}.html"
              Path('artifacts/pages',page_name).write_bytes(raw)
              return {**item,'final_url':final,'raw_sha256':digest,
                      'mentions_bist100':bool(re.search(r'\bBIST\s*100\b',text,re.I)),
                      'text':text,'saved_page':f'pages/{page_name}'}

          details=[]; detail_errors=[]
          with ThreadPoolExecutor(max_workers=12) as pool:
              futs={pool.submit(inspect,pair):pair for pair in enumerate(matched)}
              for fut in as_completed(futs):
                  try: details.append(fut.result())
                  except Exception as exc: detail_errors.append({'item':futs[fut][1],'error':repr(exc)})
          details.sort(key=lambda x:(x['announcement_date'],x['final_url']))
          relevant=[x for x in details if x['mentions_bist100']]
          periodic=[x for x in relevant if x['type']=='PERIODIC']
          nonperiodic=[x for x in relevant if x['type']=='NON_PERIODIC']
          payload={
              'source':'Borsa Istanbul Index Announcements + Borsa announcement mirrors',
              'window':{'start':START.isoformat(),'end':END.isoformat()},
              'candidate_count':len(candidates),
              'matched_borsa_mirror_count':len(matched),
              'unmatched_count':len(unmatched),
              'detail_error_count':len(detail_errors),
              'bist100_relevant_count':len(relevant),
              'periodic_bist100_count':len(periodic),
              'nonperiodic_bist100_count':len(nonperiodic),
              'announcements':relevant,
              'unmatched':unmatched,
              'scan_errors':scan_errors,
              'detail_errors':detail_errors,
          }
          Path('artifacts/bist100_borsa_mirror_corpus.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with Path('artifacts/bist100_borsa_mirror_summary.tsv').open('w',encoding='utf-8') as f:
              f.write('date\ttype\ttitle\tborsa_url\tsha256\n')
              for x in relevant:
                  f.write(f"{x['announcement_date']}\t{x['type']}\t{x['title'].replace(chr(9),' ')}\t{x['final_url']}\t{x['raw_sha256']}\n")
          print(json.dumps({k:payload[k] for k in ('candidate_count','matched_borsa_mirror_count','unmatched_count','detail_error_count','bist100_relevant_count','periodic_bist100_count','nonperiodic_bist100_count')},indent=2))
          print(Path('artifacts/bist100_borsa_mirror_summary.tsv').read_text(encoding='utf-8'))
          # Do not claim completeness here. Unmatched rows are explicit evidence gaps
          # to be resolved separately, rather than silently dropped.
          if len(periodic)<15:
              raise RuntimeError(f'too few periodic BIST100 mirror pages: {len(periodic)}')
          PY
      - name: Hash mirror corpus
        run: sha256sum artifacts/index_announcements.html artifacts/bist100_borsa_mirror_corpus.json artifacts/bist100_borsa_mirror_summary.tsv > artifacts/SHA256SUMS
      - name: Upload mirror corpus
        uses: actions/upload-artifact@v4
        with:
          name: v24-bist100-borsa-mirror-corpus
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
