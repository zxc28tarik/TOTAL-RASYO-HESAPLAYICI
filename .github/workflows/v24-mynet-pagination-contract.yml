name: V24 Mynet Pagination Contract

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-mynet-pagination-contract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Extract historical pagination code and probe request shapes
        run: |
          set -euo pipefail
          rm -rf artifacts_mynet_pagination; mkdir -p artifacts_mynet_pagination
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          import requests

          js_url='https://s.mynet.com.tr/rosetta/services/finans/production/build/js/secondary.js?id=a4611c90c7ad13e2e7c2'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','X-Requested-With':'XMLHttpRequest'})
          r=s.get(js_url,timeout=45); r.raise_for_status(); text=r.text
          Path('artifacts_mynet_pagination/secondary.js').write_text(text,encoding='utf-8')
          anchors=[]
          for needle in ['showMoreTarihselVeri','TarihselVeri','tarihselveriler','data-url','last']:
              start=0
              while True:
                  p=text.find(needle,start)
                  if p<0: break
                  anchors.append({'needle':needle,'pos':p,'snippet':text[max(0,p-1500):min(len(text),p+3000)]})
                  start=p+len(needle)
          report={'js_url':js_url,'js_sha256':hashlib.sha256(r.content).hexdigest(),'anchors':anchors}

          base='https://finans.mynet.com/borsa/hisseler/inves-investco-holding/tarihselveriler/'
          probes=[]
          for method,url,data in [
              ('GET',base+'?last=30',None),
              ('GET',base+'?last=60',None),
              ('POST',base,{'last':'30'}),
              ('POST',base,{'last':'60'}),
          ]:
              try:
                  rr=s.request(method,url,data=data,timeout=45)
                  probes.append({'method':method,'url':url,'data':data,'status':rr.status_code,'content_type':rr.headers.get('Content-Type'),'length':len(rr.content),'sha256':hashlib.sha256(rr.content).hexdigest(),'prefix':rr.text[:500]})
              except Exception as exc:
                  probes.append({'method':method,'url':url,'data':data,'error':repr(exc)})
          report['probes']=probes
          Path('artifacts_mynet_pagination/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'js_sha256':report['js_sha256'],'anchor_count':len(anchors),'probes':[{k:v for k,v in p.items() if k not in ('prefix',)} for p in probes]},ensure_ascii=False,indent=2))
          if not anchors:
              raise RuntimeError('historical pagination anchor not found in secondary.js')
          PY
      - name: Persist report
        run: |
          set -euo pipefail
          dst='data/backtest_sources/mynet_pagination_contract'; rm -rf "$dst"; mkdir -p "$dst"
          cp artifacts_mynet_pagination/report.json "$dst/"
          sha256sum artifacts_mynet_pagination/* > "$dst/SHA256SUMS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m 'V24 data audit Mynet pagination contract'
            git push origin HEAD:v24-real-data-work
          fi
