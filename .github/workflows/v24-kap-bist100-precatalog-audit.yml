name: V24 KAP BIST100 Precatalog Audit

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-kap-bist100-precatalog-audit.yml'

permissions:
  contents: read

jobs:
  audit-precatalog-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Execute canonical audit only for 2021-08-01 through 2023-09-27
        run: |
          set -euo pipefail
          mkdir -p artifacts/raw_lists artifacts/raw_details
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          source=Path('.github/workflows/v24-kap-bist100-nonperiodic-audit.yml').read_text(encoding='utf-8')
          match=re.search(r"python - <<'PY'\n(?P<body>.*?)\n          PY\n",source,re.S)
          if not match:
              raise RuntimeError('canonical audit Python body could not be extracted')
          code=textwrap.dedent(match.group('body'))

          old_parser="""def kap_publish_date(value: object) -> date:\n    text=str(value or '').strip()\n    try:\n        return datetime.strptime(text[:10],'%d.%m.%Y').date()\n    except ValueError as exc:\n        raise RuntimeError(f'KAP publishDate parse edilemedi: {text!r}') from exc\n"""
          new_parser="""def kap_publish_date(value: object) -> date:\n    text=str(value or '').strip()\n    for fmt in ('%d.%m.%Y','%Y.%m.%d','%Y-%m-%d'):\n        try:\n            return datetime.strptime(text[:10],fmt).date()\n        except ValueError:\n            pass\n    raise RuntimeError(f'KAP publishDate parse edilemedi: {text!r}')\n"""
          if code.count(old_parser) != 1:
              raise RuntimeError('canonical date parser anchor changed')
          code=code.replace(old_parser,new_parser)

          request_anchor="""        r=s.request(method,url,timeout=60,**kwargs)\n        last=r\n"""
          robust_request="""        try:\n            r=s.request(method,url,timeout=60,**kwargs)\n        except requests.RequestException:\n            if attempt == 6:\n                raise\n            time.sleep(min(30.0,2.0**attempt))\n            continue\n        last=r\n"""
          if code.count(request_anchor) != 1:
              raise RuntimeError('canonical request anchor changed')
          code=code.replace(request_anchor,robust_request)

          old_end="END_EXCLUSIVE=date(2026,8,18)"
          if code.count(old_end) != 1:
              raise RuntimeError('canonical END_EXCLUSIVE anchor changed')
          code=code.replace(old_end,"END_EXCLUSIVE=date(2023,9,28)")
          exec(compile(code,'v24-kap-bist100-precatalog-audit','exec'),{'__name__':'__main__'})
          PY
      - name: Hash audit evidence
        run: find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
      - name: Upload KAP audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-kap-bist100-precatalog-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
