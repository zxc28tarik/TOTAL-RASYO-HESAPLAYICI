name: V24F Fix Temporal Fixture

on:
  push:
    branches: [v24f-ci]
    paths:
      - '.github/workflows/v24f-fix-time-fixture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v24f-ci
          fetch-depth: 0
      - name: Put fixture runs before registered cutoffs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_historical_backtest_schedules_live.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('2022-01-02T19:00:00Z', '2022-01-02T16:00:00Z', 3),
              ('2022-02-01T19:00:00Z', '2022-02-01T16:00:00Z', 3),
          ]
          for old, new, expected in replacements:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{old} count={count}, expected {expected}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/test_historical_backtest_schedules_live.py
      - name: Commit fixture correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_historical_backtest_schedules_live.py
          git commit -m 'V24-F place fixture runs before PIT cutoffs'
          git push origin HEAD:v24f-ci
