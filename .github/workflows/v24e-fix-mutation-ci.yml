name: V24E Fix Mutation Harness

on:
  push:
    branches: [v24e-ci]
    paths:
      - '.github/workflows/v24e-fix-mutation-ci.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v24e-ci
          fetch-depth: 0
      - name: Make mutation subprocesses bytecode-cache-proof
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/v24e-ci.yml')
          s = p.read_text(encoding='utf-8')
          old_import = '          import os, subprocess, sys\n'
          new_import = '          import os, shutil, subprocess, sys\n'
          if old_import not in s:
              raise SystemExit('mutation import line not found')
          s = s.replace(old_import, new_import, 1)
          old_write = "                  mod.write_text(original.replace(old, new, 1), encoding='utf-8')\n                  cp = subprocess.run(\n"
          new_write = "                  mod.write_text(original.replace(old, new, 1), encoding='utf-8')\n                  shutil.rmtree(Path('src/analytics/__pycache__'), ignore_errors=True)\n                  cp = subprocess.run(\n"
          if old_write not in s:
              raise SystemExit('mutation write block not found')
          s = s.replace(old_write, new_write, 1)
          old_cmd = "                      [sys.executable, '-m', 'pytest', '-q', f'tests/test_historical_backtest_db.py::{test}'],\n                      env={**os.environ, 'PYTHONPATH': '.'}, text=True,\n"
          new_cmd = "                      [sys.executable, '-B', '-m', 'pytest', '-q', f'tests/test_historical_backtest_db.py::{test}'],\n                      env={**os.environ, 'PYTHONPATH': '.', 'PYTHONDONTWRITEBYTECODE': '1'}, text=True,\n"
          if old_cmd not in s:
              raise SystemExit('mutation subprocess block not found')
          s = s.replace(old_cmd, new_cmd, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/v24e-ci.yml
      - name: Commit CI harness fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v24e-ci.yml
          git commit -m 'V24-E make mutation CI cache-proof'
          git push origin HEAD:v24e-ci
