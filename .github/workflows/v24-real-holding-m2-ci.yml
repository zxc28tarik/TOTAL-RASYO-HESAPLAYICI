name: V24 Real HOLDING-GYO M2 CI

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - 'src/analytics/historical_pit_holding_m2_replay.py'
      - 'src/analytics/historical_pit_gyo_m2_replay.py'
      - 'tests/test_historical_pit_holding_m2_replay.py'
      - 'tests/test_historical_pit_gyo_m2_replay.py'
      - '.github/workflows/v24-real-holding-m2-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: total_rasyo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d total_rasyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: total_rasyo_test
      TOTAL_RASYO_TEST_DSN: postgresql://postgres:postgres@localhost:5432/total_rasyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply schema
        run: make core migrate
      - name: HOLDING and GYO PIT M2 contracts
        run: |
          python -m pytest -q \
            tests/test_historical_pit_holding_m2_replay.py \
            tests/test_historical_pit_gyo_m2_replay.py
      - name: Full regression
        run: python -m pytest -q
      - name: BANK v4.7 regression
        run: make test-bank-v47
