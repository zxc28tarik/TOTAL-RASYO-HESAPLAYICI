name: Current Ek9 targeted gap repair

on:
  push:
    branches: [codex/astra-v24-finalize]
    paths:
      - scripts/repair_current_ek9_gaps.py
      - .github/workflows/current-ek9-gap-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install supported dependencies
        run: python -m pip install -r requirements.txt 'pandas==2.2.3' 'numpy==1.26.4' pytest
      - name: Verify gap and production Ek9 regression
        run: python -m pytest -q tests/test_current_ek9_gap_repair.py tests/test_historical_pit_ek9_replay.py tests/test_ek9_live_compatibility.py
      - name: Capture exact missing prices and verify overlapping price bases
        run: python scripts/repair_current_ek9_gaps.py --capture
      - name: Recompute current Total and upper receipt from current artifacts
        run: python scripts/run_current_total_rasyo.py --date 2026-09-08 --offline --reuse-current-core --reuse-derived
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-ek9-gap-repair-evidence
          path: |
            data/live/current_ek9_gap_repair_v1/
            data/live/current_market_modules_v1/
            data/live/current_total_scores_v1/
            data/live/current_total_rasyo_run_v1/
            data/live/current_total_rasyo_v1/receipt.json
            data/live/current_total_rasyo_v1/rejections.jsonl
          retention-days: 30
