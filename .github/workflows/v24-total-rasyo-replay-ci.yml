name: V24 PIT Total Rasyo Replay CI

on:
  pull_request:
    branches: [v24-real-data-work]
    paths:
      - 'src/analytics/historical_pit_total_rasyo_replay.py'
      - 'tests/test_historical_pit_total_rasyo_replay.py'
      - 'src/analytics/total_rasyo_combine.py'
      - 'src/analytics/total_rasyo_score.py'
      - 'src/analytics/historical_pit_m1_replay.py'
      - 'src/analytics/historical_pit_m3_replay.py'
      - 'src/analytics/historical_pit_ek4_replay.py'
      - 'src/analytics/historical_pit_ek1_replay.py'
      - 'src/analytics/historical_pit_ek9_replay.py'
      - 'src/analytics/historical_pit_*_m2_replay.py'
      - 'docs/HISTORICAL_PIT_TOTAL_RASYO_REPLAY_CONTRACT.md'
      - '.github/workflows/v24-total-rasyo-replay-ci.yml'
  push:
    branches: [v24-real-data-work]
    paths:
      - 'src/analytics/historical_pit_total_rasyo_replay.py'
      - 'tests/test_historical_pit_total_rasyo_replay.py'
      - 'src/analytics/total_rasyo_combine.py'
      - 'src/analytics/total_rasyo_score.py'
      - 'src/analytics/historical_pit_m1_replay.py'
      - 'src/analytics/historical_pit_m3_replay.py'
      - 'src/analytics/historical_pit_ek4_replay.py'
      - 'src/analytics/historical_pit_ek1_replay.py'
      - 'src/analytics/historical_pit_ek9_replay.py'
      - 'src/analytics/historical_pit_*_m2_replay.py'
      - 'docs/HISTORICAL_PIT_TOTAL_RASYO_REPLAY_CONTRACT.md'
      - '.github/workflows/v24-total-rasyo-replay-ci.yml'

jobs:
  pandas-22-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned compatibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'psycopg2-binary>=2.9' pytest
      - name: Verify pinned versions
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          assert np.__version__ == '1.26.4', np.__version__
          assert pd.__version__ == '2.2.3', pd.__version__
          PY
      - name: Total Rasyo replay contract
        run: |
          python -m pytest -q \
            tests/test_historical_pit_total_rasyo_replay.py \
            tests/test_total_rasyo_score.py \
            tests/test_total_rasyo_combine.py

  default-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Total Rasyo replay plus upstream replay contracts
        run: |
          python -m pytest -q \
            tests/test_historical_pit_total_rasyo_replay.py \
            tests/test_total_rasyo_score.py \
            tests/test_total_rasyo_combine.py \
            tests/test_historical_pit_m1_replay.py \
            tests/test_historical_pit_m3_replay.py \
            tests/test_historical_pit_ek4_replay.py \
            tests/test_historical_pit_ek1_replay.py \
            tests/test_historical_pit_ek9_replay.py \
            tests/test_historical_pit_nonfin_m2_replay.py \
            tests/test_historical_pit_holding_m2_replay.py \
            tests/test_historical_pit_gyo_m2_replay.py \
            tests/test_historical_pit_insurance_m2_replay.py \
            tests/test_historical_pit_financial_m2_replay.py \
            tests/test_historical_pit_bank_m2_replay.py
