name: V24D Targeted Audit

on:
  push:
    branches: [v24d-ci]
    paths:
      - '.github/workflows/v24d-targeted-audit.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v24d-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Migration audit only
        run: python -m pytest -q tests/test_audit_evidence_metadata.py::test_migration_sayisi_makefile_ile_tutarli
