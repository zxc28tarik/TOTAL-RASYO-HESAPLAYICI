name: V24 Borsa THB Schema Proof

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-borsa-thb-schema-proof.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official THB CSV headers and target rows
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          rm -rf artifacts_thb_schema; mkdir -p artifacts_thb_schema
          python - <<'PY'
          import hashlib, io, json, zipfile
          from pathlib import Path
          import requests

          targets={
            'INVES':['2022-07-01','2022-08-01','2022-09-01'],
            'KLRHO':['2023-01-02','2023-02-01','2023-03-01','2023-04-03','2023-05-02','2023-06-01'],
            'ASGYO':['2024-01-02','2024-02-01','2024-03-01'],
          }
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          out=[]
          for ticker,days in targets.items():
            for day in days:
              y,m,d=day.split('-'); ymd=y+m+d
              url=f'https://borsaistanbul.com/data/thb/{y}/{m}/thb{ymd}1.zip'
              r=s.get(url,timeout=45); r.raise_for_status()
              ash=hashlib.sha256(r.content).hexdigest()
              with zipfile.ZipFile(io.BytesIO(r.content)) as z:
                csv_names=[n for n in z.namelist() if n.lower().endswith('.csv')]
                if not csv_names: raise RuntimeError(f'no csv in {url}')
                name=csv_names[0]; data=z.read(name)
              text=data.decode('utf-8-sig')
              lines=text.splitlines()
              target=[line for line in lines if f';{ticker}.E;' in line]
              if len(target)!=1:
                raise RuntimeError(f'{ticker} {day}: expected exactly one .E row, got {len(target)}')
              out.append({
                'trade_date':day,'ticker':ticker,'archive_url':url,'archive_sha256':ash,
                'member':name,'member_sha256':hashlib.sha256(data).hexdigest(),
                'first_lines':lines[:8],
                'target_row':target[0],
                'target_field_count':len(target[0].split(';')),
                'first_line_field_count':len(lines[0].split(';')) if lines else 0,
              })
          dst=Path('artifacts_thb_schema/thb_schema_proof.json')
          dst.write_text(json.dumps({'contract':'V24_BORSA_THB_SCHEMA_PROOF_V1','rows':out},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'rows':len(out),'sample':out[0]},ensure_ascii=False,indent=2))
          PY
          sha256sum artifacts_thb_schema/thb_schema_proof.json > artifacts_thb_schema/SHA256SUMS
      - name: Persist schema proof
        run: |
          set -euo pipefail
          dst='data/backtest_sources/borsa_exact_price_gap_discovery'
          mkdir -p "$dst"
          cp artifacts_thb_schema/thb_schema_proof.json artifacts_thb_schema/SHA256SUMS "$dst/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m 'V24 data prove Borsa THB schema for price gaps'
            git push origin HEAD:v24-real-data-work
          fi
