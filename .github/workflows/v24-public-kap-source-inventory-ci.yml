name: V24 Public KAP Source Inventory CI

on:
  push:
    branches:
      - v24-real-data-work
      - codex/v24-public-kap-source-package
    paths:
      - 'src/ingest/public_kap_pit.py'
      - 'src/ingest/public_kap_source_inventory.py'
      - 'tests/test_public_kap_pit.py'
      - 'tests/test_public_kap_source_inventory.py'
      - 'docs/PUBLIC_KAP_PIT_COLLECTOR_CONTRACT.md'
      - 'docs/PUBLIC_KAP_SOURCE_INVENTORY_CONTRACT.md'
      - 'src/analytics/historical_cutoff_execution_policy.py'
      - 'data/backtest_sources/xu100_signal_dates_yahoo_2021-08_2026-07.csv'
      - 'data/backtest_sources/m3_source_package/index_closes.csv.gz'
      - 'data/backtest_sources/yahoo_resolved/monthly_member_signal_price_coverage.csv'
      - '.github/workflows/v24-public-kap-source-inventory-ci.yml'
  pull_request:
    branches: [v24-real-data-work]
    paths:
      - 'src/ingest/public_kap_pit.py'
      - 'src/ingest/public_kap_source_inventory.py'
      - 'tests/test_public_kap_pit.py'
      - 'tests/test_public_kap_source_inventory.py'
      - 'docs/PUBLIC_KAP_PIT_COLLECTOR_CONTRACT.md'
      - 'docs/PUBLIC_KAP_SOURCE_INVENTORY_CONTRACT.md'
      - 'src/analytics/historical_cutoff_execution_policy.py'
      - 'data/backtest_sources/xu100_signal_dates_yahoo_2021-08_2026-07.csv'
      - 'data/backtest_sources/m3_source_package/index_closes.csv.gz'
      - 'data/backtest_sources/yahoo_resolved/monthly_member_signal_price_coverage.csv'
      - '.github/workflows/v24-public-kap-source-inventory-ci.yml'

permissions:
  contents: read

jobs:
  source-inventory-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'pandas==2.2.3' \
            pytest
      - name: Verify pinned versions
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          assert np.__version__ == '1.26.4', np.__version__
          assert pd.__version__ == '2.2.3', pd.__version__
          print(f'numpy={np.__version__} pandas={pd.__version__}')
          PY
      - name: Public KAP snapshot and 6000-cell inventory contracts
        run: |
          python -m pytest -q \
            tests/test_public_kap_pit.py \
            tests/test_public_kap_source_inventory.py
