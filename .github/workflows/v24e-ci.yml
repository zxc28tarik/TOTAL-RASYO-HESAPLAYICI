name: V24E CI

on:
  push:
    branches: [v24e-ci]
    paths:
      - src/analytics/historical_backtest_db.py
      - tests/test_historical_backtest_db.py
      - tests/test_historical_backtest_db_live.py
      - tests/test_historical_universe_truncate_live.py
      - sql/041_historical_universe_truncate_guard.sql
      - Makefile
      - tests/test_audit_evidence_metadata.py
      - '.github/workflows/v24e-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: total_rasyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d total_rasyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: total_rasyo_test
      TOTAL_RASYO_TEST_DSN: postgresql://postgres:postgres@localhost:5432/total_rasyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply 36 migrations
        run: make core migrate
      - name: V24-B/C/D/E targeted contract
        run: |
          python -m pytest -q \
            tests/test_historical_backtest_db.py \
            tests/test_historical_backtest_db_live.py \
            tests/test_historical_universe_truncate_live.py \
            tests/test_historical_backtest_inputs.py \
            tests/test_monthly_total_rasyo_portfolio.py \
            tests/test_historical_universe.py \
            tests/test_historical_universe_live.py \
            tests/test_audit_evidence_metadata.py::test_migration_sayisi_makefile_ile_tutarli
      - name: V24-E Python mutations — 8 guards must die
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, shutil, subprocess, sys

          mod = Path('src/analytics/historical_backtest_db.py')
          original = mod.read_text(encoding='utf-8')
          mutations = [
              ('scope_filter', 'g["run_scope"].eq("FULL_UNIVERSE")', 'pd.Series(True, index=g.index)', 'test_later_targeted_run_is_filtered_not_selected'),
              ('status_filter', 'g["overall_status"].isin(VALID_RUN_STATUSES)', 'pd.Series(True, index=g.index)', 'test_partial_or_persistence_error_runs_are_not_backtest_authority'),
              ('persistence_filter', 'g["persistence_status"].eq("OK")', 'pd.Series(True, index=g.index)', 'test_partial_or_persistence_error_runs_are_not_backtest_authority'),
              ('authority_count', 'if not bad_counts.empty:', 'if False and not bad_counts.empty:', 'test_authoritative_registry_count_mismatch_fails_closed'),
              ('persisted_count', 'if len(group) != expected_count:', 'if False and len(group) != expected_count:', 'test_persisted_result_count_must_match_registry'),
              ('analysis_lineage', 'if not group["analysis_at"].map(lambda x: x == expected_analysis).all():', 'if False and not group["analysis_at"].map(lambda x: x == expected_analysis).all():', 'test_result_analysis_at_must_match_registry'),
              ('analysis_ambiguity', 'if eligible["analysis_at"].duplicated().any():', 'if False and eligible["analysis_at"].duplicated().any():', 'test_duplicate_authoritative_analysis_at_is_ambiguous'),
              ('timezone_awareness', 'if ts.tzinfo is None or ts.utcoffset() is None:', 'if False and (ts.tzinfo is None or ts.utcoffset() is None):', 'test_naive_analysis_timestamp_is_rejected'),
          ]
          try:
              for name, old, new, test in mutations:
                  if original.count(old) != 1:
                      raise SystemExit(f'{name}: mutation target count={original.count(old)}, expected 1')
                  mod.write_text(original.replace(old, new, 1), encoding='utf-8')
                  shutil.rmtree(Path('src/analytics/__pycache__'), ignore_errors=True)
                  cp = subprocess.run(
                      [sys.executable, '-B', '-m', 'pytest', '-q', f'tests/test_historical_backtest_db.py::{test}'],
                      env={**os.environ, 'PYTHONPATH': '.', 'PYTHONDONTWRITEBYTECODE': '1'}, text=True,
                  )
                  if cp.returncode == 0:
                      raise SystemExit(f'{name} mutation SURVIVED')
                  print(f'{name} mutation KILLED')
                  mod.write_text(original, encoding='utf-8')
          finally:
              mod.write_text(original, encoding='utf-8')
          PY
      - name: V24-E SQL mutation — TRUNCATE guard must die
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('sql/041_historical_universe_truncate_guard.sql').read_text(encoding='utf-8')
          stanza = """CREATE TRIGGER trg_universe_membership_history_no_truncate
            BEFORE TRUNCATE ON core.universe_membership_history
            FOR EACH STATEMENT
            EXECUTE FUNCTION core.universe_membership_history_reject_truncate();"""
          if src.count(stanza) != 1:
              raise SystemExit(f'truncate trigger stanza count={src.count(stanza)}, expected 1')
          Path('/tmp/041_mut.sql').write_text(
              src.replace(stanza, '-- MUTATION: TRUNCATE guard removed', 1),
              encoding='utf-8',
          )
          PY
          psql -d postgres -c 'CREATE DATABASE v24e_mut_truncate;'
          PGDATABASE=v24e_mut_truncate psql -v ON_ERROR_STOP=1 -f sql/010_create_core_tables.sql
          PGDATABASE=v24e_mut_truncate psql -v ON_ERROR_STOP=1 -f sql/040_historical_universe_membership.sql
          PGDATABASE=v24e_mut_truncate psql -v ON_ERROR_STOP=1 -f /tmp/041_mut.sql
          if TOTAL_RASYO_TEST_DSN=postgresql://postgres:postgres@localhost:5432/v24e_mut_truncate \
             python -m pytest -q tests/test_historical_universe_truncate_live.py; then
            echo 'truncate mutation SURVIVED'
            exit 1
          else
            echo 'truncate mutation KILLED'
          fi
      - name: Reset PostgreSQL before full regression
        shell: bash
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS total_rasyo_test WITH (FORCE);'
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE total_rasyo_test;'
          make core migrate
      - name: Full regression
        run: python -m pytest -q
      - name: BANK v4.7 regression
        run: make test-bank-v47
