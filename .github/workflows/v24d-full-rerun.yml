name: V24D Full Rerun

on:
  push:
    branches: [v24d-ci]
    paths:
      - '.github/workflows/v24d-full-rerun.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: total_rasyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d total_rasyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: total_rasyo_test
      TOTAL_RASYO_TEST_DSN: postgresql://postgres:postgres@localhost:5432/total_rasyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply schema including V24-D migration
        run: make core migrate
      - name: Full regression
        run: python -m pytest -q
      - name: BANK v4.7 regression
        run: make test-bank-v47
      - name: Build SQL mutations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('sql/040_historical_universe_membership.sql').read_text()
          overlap = """CREATE TRIGGER trg_universe_membership_history_guard_insert
            BEFORE INSERT ON core.universe_membership_history
            FOR EACH ROW EXECUTE FUNCTION core.universe_membership_history_guard_insert();"""
          immutable = """CREATE TRIGGER trg_universe_membership_history_immutable
            BEFORE UPDATE OR DELETE ON core.universe_membership_history
            FOR EACH ROW EXECUTE FUNCTION core.universe_membership_history_immutable();"""
          if src.count(overlap) != 1:
              raise SystemExit(f'overlap trigger stanza count={src.count(overlap)}, expected 1')
          if src.count(immutable) != 1:
              raise SystemExit(f'immutable trigger stanza count={src.count(immutable)}, expected 1')
          Path('/tmp/040_mut_overlap.sql').write_text(src.replace(overlap, '-- MUTATION: overlap trigger removed', 1))
          Path('/tmp/040_mut_immutable.sql').write_text(src.replace(immutable, '-- MUTATION: immutable trigger removed', 1))
          PY
      - name: SQL mutation — overlap trigger must be protected
        shell: bash
        run: |
          set -euo pipefail
          psql -d postgres -c 'CREATE DATABASE v24d_mut_overlap;'
          PGDATABASE=v24d_mut_overlap psql -v ON_ERROR_STOP=1 -f sql/010_create_core_tables.sql
          PGDATABASE=v24d_mut_overlap psql -v ON_ERROR_STOP=1 -f /tmp/040_mut_overlap.sql
          if TOTAL_RASYO_TEST_DSN=postgresql://postgres:postgres@localhost:5432/v24d_mut_overlap \
             python -m pytest -q tests/test_historical_universe_live.py::test_database_rejects_overlap_against_existing_history; then
            echo 'overlap mutation SURVIVED'
            exit 1
          else
            echo 'overlap mutation KILLED'
          fi
      - name: SQL mutation — immutability trigger must be protected
        shell: bash
        run: |
          set -euo pipefail
          psql -d postgres -c 'CREATE DATABASE v24d_mut_immutable;'
          PGDATABASE=v24d_mut_immutable psql -v ON_ERROR_STOP=1 -f sql/010_create_core_tables.sql
          PGDATABASE=v24d_mut_immutable psql -v ON_ERROR_STOP=1 -f /tmp/040_mut_immutable.sql
          if TOTAL_RASYO_TEST_DSN=postgresql://postgres:postgres@localhost:5432/v24d_mut_immutable \
             python -m pytest -q tests/test_historical_universe_live.py::test_history_rows_are_immutable_update_and_delete; then
            echo 'immutable mutation SURVIVED'
            exit 1
          else
            echo 'immutable mutation KILLED'
          fi
