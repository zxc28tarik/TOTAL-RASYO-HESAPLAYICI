name: V24 BIST Equity Name Aliases

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-bist-equity-name-aliases.yml'

permissions:
  contents: read

jobs:
  build-name-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XLS reader
        run: python -m pip install --disable-pip-version-check xlrd
      - name: Download hash-locked official Borsa sources
        run: |
          set -euo pipefail
          mkdir -p work/code_changes artifacts
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://borsaistanbul.com/datum/hisse_endeks_ds.csv' \
            -o work/hisse_endeks_ds.csv
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://borsaistanbul.com/datum/payadvekoddegisiklikleri.zip' \
            -o work/payadvekoddegisiklikleri.zip
          echo '04017af0e22aefd23b02f75cc96fa71a4f80b5c1dc6ee661dd57f1052e4712ef  work/hisse_endeks_ds.csv' | sha256sum -c -
          echo 'c8068dab5643940e6efe23b7920d2dc0b454f3878f365150111754cb631f2076  work/payadvekoddegisiklikleri.zip' | sha256sum -c -
          unzip -q work/payadvekoddegisiklikleri.zip -d work/code_changes
          echo '04c4dcc19f285ca20f093d97ae12c2ee9461fb6c80a583324e88d75789747a08  work/code_changes/PayAdiDegisiklikleri.xls' | sha256sum -c - || {
            echo 'PayAdiDegisiklikleri.xls workbook hash changed from previously inspected archive; refusing alias generation' >&2
            sha256sum work/code_changes/PayAdiDegisiklikleri.xls >&2
            exit 1
          }
      - name: Build current and historical bulletin-name alias evidence
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, re, unicodedata
          from datetime import datetime
          from pathlib import Path
          import xlrd

          REPORT_SHA='04017af0e22aefd23b02f75cc96fa71a4f80b5c1dc6ee661dd57f1052e4712ef'
          NAME_ARCHIVE_SHA='c8068dab5643940e6efe23b7920d2dc0b454f3878f365150111754cb631f2076'
          NAME_BOOK_SHA='04c4dcc19f285ca20f093d97ae12c2ee9461fb6c80a583324e88d75789747a08'

          def norm(value):
              text=unicodedata.normalize('NFKD',str(value or '').strip())
              text=''.join(ch for ch in text if not unicodedata.combining(ch))
              text=text.upper().replace('İ','I').replace('İ','I')
              text=re.sub(r'[^A-Z0-9]+',' ',text)
              return re.sub(r'\s+',' ',text).strip()

          rows=[]
          # Current official bulletin names across all equity-index constituent rows.
          with Path('work/hisse_endeks_ds.csv').open('r',encoding='utf-8-sig',newline='') as f:
              r=csv.reader(f,delimiter=';')
              header1=next(r); header2=next(r)
              if header1[:3] != ['BILESEN KODU','BULTEN_ADI','ENDEKS KODU']:
                  raise RuntimeError(f'unexpected hisse_endeks header: {header1[:3]}')
              for values in r:
                  if len(values)<6: continue
                  raw_code=values[0].strip().upper()
                  name=values[1].strip()
                  day=values[5].strip()
                  if not raw_code or not name: continue
                  code=raw_code[:-2] if raw_code.endswith('.E') else raw_code
                  if '.' in code: continue
                  rows.append({
                      'ticker_alias':code,
                      'bulletin_name':name,
                      'normalized_name':norm(name),
                      'validity_hint':'CURRENT_REPORT',
                      'event_date':day,
                      'source_type':'CURRENT_EQUITY_INDEX_REPORT',
                      'source_sha256':REPORT_SHA,
                  })

          # Historical before/after bulletin names, keyed by the code used in the official change row.
          wb=xlrd.open_workbook('work/code_changes/PayAdiDegisiklikleri.xls')
          ws=wb.sheet_by_name('BULTEN ADI_DEGISENLER')
          for i in range(ws.nrows):
              vals=[]
              for c in range(ws.ncols):
                  cell=ws.cell(i,c)
                  if cell.ctype == xlrd.XL_CELL_DATE:
                      vals.append(xlrd.xldate_as_datetime(cell.value,wb.datemode))
                  else:
                      vals.append(cell.value)
              if len(vals)<4: continue
              code=str(vals[0] or '').strip().upper()
              before=str(vals[1] or '').strip()
              after=str(vals[2] or '').strip()
              raw_day=vals[3]
              if not code or code in {'KOD','CODE'} or not before or not after: continue
              if isinstance(raw_day,datetime):
                  day=raw_day.date().isoformat()
              else:
                  day=str(raw_day).strip()
              for label,name in (('BEFORE_CHANGE',before),('AFTER_CHANGE',after)):
                  rows.append({
                      'ticker_alias':code,
                      'bulletin_name':name,
                      'normalized_name':norm(name),
                      'validity_hint':label,
                      'event_date':day,
                      'source_type':'OFFICIAL_EQUITY_NAME_CHANGE',
                      'source_sha256':NAME_BOOK_SHA,
                  })

          # Deduplicate exact source facts only; conflicting aliases are intentionally retained for fail-closed resolution.
          dedup={}
          for row in rows:
              key=tuple(row[k] for k in ('ticker_alias','bulletin_name','normalized_name','validity_hint','event_date','source_type','source_sha256'))
              dedup[key]=row
          rows=sorted(dedup.values(), key=lambda x:(x['normalized_name'],x['ticker_alias'],x['event_date'],x['validity_hint']))
          if not rows:
              raise RuntimeError('no equity-name aliases generated')
          if any(not r['normalized_name'] for r in rows):
              raise RuntimeError('empty normalized bulletin name')

          out=Path('artifacts/bist_equity_name_aliases_2026-08-17.csv')
          fields=['ticker_alias','bulletin_name','normalized_name','validity_hint','event_date','source_type','source_sha256']
          with out.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          payload={
              'publisher':'Borsa Istanbul A.S.',
              'current_report_sha256':REPORT_SHA,
              'name_change_archive_sha256':NAME_ARCHIVE_SHA,
              'name_change_workbook_sha256':NAME_BOOK_SHA,
              'alias_fact_count':len(rows),
              'unique_normalized_name_count':len({r['normalized_name'] for r in rows}),
              'unique_ticker_alias_count':len({r['ticker_alias'] for r in rows}),
              'output_csv_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
          }
          Path('artifacts/bist_equity_name_aliases_2026-08-17.provenance.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          # Known anchor names from disclosure 1618229 must be present without fuzzy matching.
          anchors={'BERA HOLDING','KONTROLMATIK TEKNOLOJI','AKSA ENERJI','PLASTIKKART AKILLI KART'}
          names={r['normalized_name'] for r in rows}
          missing=sorted(anchors-names)
          if missing:
              raise RuntimeError(f'known KAP bulletin-name anchors missing from official aliases: {missing}')
          PY
      - name: Hash alias evidence
        run: sha256sum artifacts/* > artifacts/SHA256SUMS
      - name: Upload alias evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-bist-equity-name-aliases
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
