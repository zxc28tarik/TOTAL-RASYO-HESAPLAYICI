name: V24 KAP BIST100 Precatalog Fast Audit

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-kap-bist100-precatalog-fast-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Audit pre-catalog Borsa KAP disclosures
        run: |
          set -euo pipefail
          mkdir -p artifacts/raw_lists artifacts/raw_details
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time, unicodedata
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date, timedelta
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          BASE='https://www.kap.org.tr'
          OID='4028e4a14bcf2a06014be4d7e6e256b6'
          START=date(2021,8,1); END=date(2023,9,28)
          UA='Mozilla/5.0 (compatible; TotalRasyoPrecatalogAudit/2.0)'

          def norm(v):
              raw=unicodedata.normalize('NFKD',str(v or ''))
              raw=''.join(c for c in raw if not unicodedata.combining(c))
              return re.sub(r'\s+',' ',raw).strip().upper()

          def call(method,url,**kwargs):
              last=None
              for attempt in range(8):
                  try:
                      r=requests.request(method,url,timeout=60,headers={
                          'User-Agent':UA,'Accept':'application/json, text/plain, */*','Referer':BASE+'/tr/bildirim-sorgu',
                          **kwargs.pop('headers',{})},**kwargs)
                  except requests.RequestException:
                      if attempt==7: raise
                      time.sleep(min(15,2**attempt)); continue
                  last=r
                  if r.status_code!=429 and r.status_code<500: return r
                  time.sleep(min(15,2**attempt))
              return last

          warm=call('GET',BASE+'/tr/bildirim-sorgu'); warm.raise_for_status()
          all_rows=[]; cursor=START; nwin=0
          while cursor<END:
              to=min(cursor+timedelta(days=29),END-timedelta(days=1))
              payload={'fromDate':cursor.isoformat(),'toDate':to.isoformat(),'mkkMemberOidList':[OID],'subjectList':[]}
              r=call('POST',BASE+'/tr/api/disclosure/members/byCriteria',json=payload,headers={'Content-Type':'application/json'})
              r.raise_for_status(); rows=r.json()
              if not isinstance(rows,list) or len(rows)>=2000: raise RuntimeError(f'bad/truncated list {cursor}..{to}: {len(rows) if isinstance(rows,list) else type(rows)}')
              wrong=[x for x in rows if x.get('kapTitle') not in {'BORSA İSTANBUL A.Ş.','BORSA İSTANBUL BISTECH DEVRE KESİCİ UYGULAMASI'}]
              if wrong: raise RuntimeError(f'OID filter leak: {len(wrong)}')
              nwin+=1; Path(f'artifacts/raw_lists/{nwin:03d}_{cursor}_{to}.json').write_bytes(r.content)
              all_rows.extend(rows); cursor=to+timedelta(days=1)

          by_id={}
          for row in all_rows:
              idx=int(row['disclosureIndex'])
              if idx in by_id and by_id[idx]!=row: raise RuntimeError(f'conflicting duplicate {idx}')
              by_id[idx]=row

          def is_index(row):
              hay=norm(' '.join(str(row.get(k) or '') for k in ('subject','summary')))
              return ('ENDEKS' in hay or 'INDEX' in hay) and 'DEVRE KESICI' not in hay
          candidates=[by_id[k] for k in sorted(by_id) if is_index(by_id[k])]

          def fetch_detail(row):
              idx=int(row['disclosureIndex'])
              r=call('GET',BASE+f'/tr/api/notification/attachment-detail/{idx}')
              if r.status_code!=200: raise RuntimeError(f'detail {idx}: HTTP {r.status_code}')
              raw=r.content; obj=r.json(); root=obj[0] if isinstance(obj,list) and obj else obj
              disclosure=root['disclosure']; basic=disclosure['disclosureBasic']; body=root.get('disclosureBody',[])
              if basic.get('companyTitle')!='BORSA İSTANBUL A.Ş.' or basic.get('mkkMemberOid')!=OID: raise RuntimeError(f'filer mismatch {idx}')
              html='\n'.join(body if isinstance(body,list) else [str(body)])
              soup=BeautifulSoup(html,'html.parser'); plain=' '.join(soup.stripped_strings); n=norm(plain)
              xrows=[]
              for tr in soup.find_all('tr'):
                  cells=[' '.join(c.stripped_strings) for c in tr.find_all(['td','th'])]
                  if cells and any('XU100' in norm(c) for c in cells): xrows.append(cells)
              return idx,raw,{
                  'disclosureIndex':idx,'publishDate':basic.get('publishDate'),'title':basic.get('title'),'summary':basic.get('summary'),
                  'relatedStocks':basic.get('relatedStocks'),'source_url':BASE+f'/tr/Bildirim/{idx}',
                  'source_detail_sha256':hashlib.sha256(raw).hexdigest(),'explicit_xu100':('XU100' in n or 'BIST 100' in n),
                  'xu100_table_rows':xrows,'plain_text':plain,
              }

          details=[]; failures=[]
          with ThreadPoolExecutor(max_workers=4) as ex:
              futs={ex.submit(fetch_detail,row):int(row['disclosureIndex']) for row in candidates}
              for fut in as_completed(futs):
                  idx=futs[fut]
                  try:
                      idx,raw,item=fut.result(); Path(f'artifacts/raw_details/{idx}.json').write_bytes(raw); details.append(item)
                  except Exception as exc: failures.append({'disclosureIndex':idx,'error':repr(exc)})
          if failures:
              Path('artifacts/failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              raise RuntimeError(f'{len(failures)} detail failures')
          details.sort(key=lambda x:x['disclosureIndex'])
          explicit=[x for x in details if x['explicit_xu100']]
          payload={'publisher':'KAP / Borsa Istanbul A.S.','window':{'start':START.isoformat(),'end_exclusive':END.isoformat()},
                   'list_window_count':nwin,'unique_borsa_disclosure_count':len(by_id),'index_related_detail_count':len(details),
                   'explicit_xu100_detail_count':len(explicit),'explicit_xu100':explicit}
          Path('artifacts/precatalog_xu100_audit.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('artifacts/all_index_details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k!='explicit_xu100'},ensure_ascii=False,indent=2))
          for x in explicit: print(json.dumps({k:x[k] for k in ('disclosureIndex','publishDate','title','summary','relatedStocks','source_detail_sha256','xu100_table_rows')},ensure_ascii=False))
          PY
      - name: Hash evidence
        run: find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: v24-kap-bist100-precatalog-fast-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
