name: V24 Real XU100 Calendar

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-real-market-data.yml'

permissions:
  contents: read

jobs:
  extract-xu100-calendar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: total_rasyo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d total_rasyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: total_rasyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply schema
        run: make core migrate
      - name: Fetch real XU100 daily history from Yahoo Finance
        run: >-
          PYTHONPATH=. python -c 'from src.app.cli import main; main()'
          fetch-yf-index
          --index XU100
          --yahoo XU100.IS
          --start 2021-08-01
          --end 2026-08-01
      - name: Export locked 60-month signal-date skeleton
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python scripts/export_historical_signal_dates.py \
            --start-month 2021-08 \
            --end-month 2026-07 \
            --expected-months 60 \
            --index-code XU100 \
            --csv-out artifacts/v24_xu100_signal_dates_2021-08_2026-07.csv \
            --json-out artifacts/v24_xu100_signal_dates_2021-08_2026-07.json
      - name: Export daily XU100 evidence
        run: |
          mkdir -p artifacts
          psql -v ON_ERROR_STOP=1 -c "\copy (SELECT index_code, trade_date, open, high, low, close, volume FROM core.index_prices_daily WHERE index_code='XU100' AND trade_date >= DATE '2021-08-01' AND trade_date < DATE '2026-08-01' ORDER BY trade_date) TO 'artifacts/v24_xu100_daily_2021-08_2026-07.csv' CSV HEADER"
          sha256sum artifacts/v24_xu100_daily_2021-08_2026-07.csv artifacts/v24_xu100_signal_dates_2021-08_2026-07.csv artifacts/v24_xu100_signal_dates_2021-08_2026-07.json > artifacts/SHA256SUMS
          test "$(($(wc -l < artifacts/v24_xu100_signal_dates_2021-08_2026-07.csv)-1))" -eq 60
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: v24-xu100-calendar-2021-08_2026-07
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
