name: V24 Publish KAP Public Byte Evidence

on:
  push:
    branches:
      - codex/p1-kap-semantic-family-coverage
    paths:
      - '.github/workflows/v24-kap-public-byte-evidence-publish.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOURCE_RUN_ID: '33568804543'
      SOURCE_HEAD_SHA: 'd890a3a996a7da9080f86853df32b276549a5d27'
      RELEASE_TAG: 'kap-bulk-byte-evidence-d890a3a996a7'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p1-kap-semantic-family-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public evidence unit contracts
        run: python -m pytest -q tests/test_kap_bulk_public_evidence.py
      - name: Wait for exact source acquisition run
        run: |
          gh run watch "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          observed_head="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          observed_conclusion="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          test "$observed_head" = "$SOURCE_HEAD_SHA"
          test "$observed_conclusion" = "success"
      - name: Download exact source artifacts
        run: |
          mkdir -p evidence/raw evidence/source evidence/public
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "kap-bulk-raw-archives-$SOURCE_HEAD_SHA" \
            --dir evidence/raw
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "kap-bulk-acquisition-receipt-$SOURCE_HEAD_SHA" \
            --dir evidence/source
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "kap-bulk-technical-schema-discovery-$SOURCE_HEAD_SHA" \
            --dir evidence/source
      - name: Re-hash every released ZIP against preserved manifest
        run: |
          python scripts/build_kap_bulk_public_evidence.py \
            --raw-dir evidence/raw \
            --workflow-run-id "$SOURCE_RUN_ID" \
            --acquisition-head-sha "$SOURCE_HEAD_SHA" \
            --output-json evidence/public/public_byte_evidence.json \
            --output-sha256s evidence/public/SHA256SUMS.observed \
            --require-exact
          test "$(find evidence/raw -maxdepth 1 -type f -name 'KAP_*.zip' | wc -l)" -eq 28
          test -s evidence/source/kap-bulk-acquisition-receipt.json
          test -s evidence/source/kap-bulk-technical-schema-discovery.json
      - name: Commit small public evidence receipts
        run: |
          target_dir='data/backtest_sources/kap_bulk_financial_source_capture/public_byte_evidence'
          mkdir -p "$target_dir"
          cp evidence/public/public_byte_evidence.json "$target_dir/run_33568804543.json"
          cp evidence/public/SHA256SUMS.observed "$target_dir/SHA256SUMS.run_33568804543.observed"
          cp evidence/source/kap-bulk-acquisition-receipt.json "$target_dir/acquisition_receipt.run_33568804543.json"
          cp evidence/source/kap-bulk-technical-schema-discovery.json "$target_dir/technical_schema_discovery.run_33568804543.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target_dir"
          if ! git diff --cached --quiet; then
            git commit -m 'Record public KAP byte evidence for run 33568804543'
            git push origin HEAD:codex/p1-kap-semantic-family-coverage
          fi
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish 28 raw KAP ZIPs as public release assets
        run: |
          notes_file='evidence/public/RELEASE_NOTES.md'
          cat > "$notes_file" <<EOF
          Public byte-level evidence for KAP bulk financial archives reacquired by workflow run $SOURCE_RUN_ID.

          Acquisition code head: $SOURCE_HEAD_SHA
          Evidence commit: $EVIDENCE_COMMIT

          The 28 raw ZIP assets are published only so independent reviewers can download and hash the exact bytes themselves. The committed SHA256SUMS and JSON receipt are derived again from these downloaded artifact bytes before release publication.

          This release does NOT authorize semantic mapping, PIT materialization, or real 60-cutoff scoring by itself.
          EOF
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$EVIDENCE_COMMIT" \
              --title "KAP bulk raw byte evidence — run $SOURCE_RUN_ID" \
              --notes-file "$notes_file" \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            evidence/raw/KAP_*.zip \
            evidence/public/public_byte_evidence.json \
            evidence/public/SHA256SUMS.observed \
            evidence/source/kap-bulk-acquisition-receipt.json \
            evidence/source/kap-bulk-technical-schema-discovery.json
      - name: Verify public release asset count
        run: |
          asset_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          echo "release_asset_count=$asset_count"
          test "$asset_count" -ge 32
