name: V24 Publish KAP Public Byte Evidence

on:
  push:
    branches:
      - codex/p1-kap-semantic-family-coverage
    paths:
      - '.github/workflows/v24-kap-public-byte-evidence-publish.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOURCE_RUN_ID: '33568804543'
      SOURCE_HEAD_SHA: 'd890a3a996a7da9080f86853df32b276549a5d27'
      RELEASE_TAG: 'kap-bulk-byte-evidence-run-33568804543'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p1-kap-semantic-family-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier test dependency
        run: python -m pip install pytest
      - name: Verify public evidence unit contracts
        run: python -m pytest -q tests/test_kap_bulk_public_evidence.py
      - name: Verify source acquisition identity
        run: |
          observed_head="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          observed_status="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
          observed_conclusion="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          echo "source_run_status=$observed_status"
          echo "source_run_conclusion=$observed_conclusion"
          test "$observed_head" = "$SOURCE_HEAD_SHA"
          test "$observed_status" = "completed"
      - name: Download exact source raw bytes and receipt
        run: |
          mkdir -p evidence/raw evidence/source evidence/public
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "kap-bulk-raw-archives-$SOURCE_HEAD_SHA" \
            --dir evidence/raw
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "kap-bulk-acquisition-receipt-$SOURCE_HEAD_SHA" \
            --dir evidence/source
          test "$(find evidence/raw -maxdepth 1 -type f -name 'KAP_*.zip' | wc -l)" -eq 28
          test -s evidence/source/kap-bulk-acquisition-receipt.json
      - name: Re-hash public snapshot against acquisition receipt and preserved manifest
        run: |
          python scripts/build_kap_bulk_public_evidence.py \
            --raw-dir evidence/raw \
            --acquisition-receipt evidence/source/kap-bulk-acquisition-receipt.json \
            --workflow-run-id "$SOURCE_RUN_ID" \
            --acquisition-head-sha "$SOURCE_HEAD_SHA" \
            --output-json evidence/public/public_byte_evidence.json \
            --output-sha256s evidence/public/SHA256SUMS.observed \
            --require-publishable-snapshot
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('evidence/public/public_byte_evidence.json').read_text())
          print('snapshot_complete=', p['snapshot_complete'])
          print('manifest_exact_match_count=', p['manifest_exact_match_count'])
          print('manifest_drift_count=', p['manifest_drift_count'])
          print('receipt_byte_match_count=', p['receipt_byte_match_count'])
          print('drifts=', [row['filename'] for row in p['drifts']])
          assert p['snapshot_complete'] is True
          assert p['receipt_byte_match_count'] == 28
          assert p['public_byte_verified_count'] == 28
          assert p['semantic_mapping_authorized'] is False
          assert p['pit_materialization_authorized'] is False
          assert p['real_60_cutoff_scoring_authorized'] is False
          PY
      - name: Commit small immutable drift evidence
        run: |
          target_dir='data/backtest_sources/kap_bulk_financial_source_capture/public_byte_evidence'
          mkdir -p "$target_dir"
          cp evidence/public/public_byte_evidence.json "$target_dir/run_33568804543.json"
          cp evidence/public/SHA256SUMS.observed "$target_dir/SHA256SUMS.run_33568804543.observed"
          cp evidence/source/kap-bulk-acquisition-receipt.json "$target_dir/acquisition_receipt.run_33568804543.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target_dir"
          if ! git diff --cached --quiet; then
            git commit -m 'Record KAP snapshot drift evidence for run 33568804543'
            git push origin HEAD:codex/p1-kap-semantic-family-coverage
          fi
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish 28 raw KAP ZIPs as public release assets
        run: |
          notes_file='evidence/public/RELEASE_NOTES.md'
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(Path('evidence/public/public_byte_evidence.json').read_text())
          drift_names = ', '.join(row['filename'] for row in p['drifts']) or 'none'
          Path('evidence/public/RELEASE_NOTES.md').write_text(
              f"Public byte-level evidence for official KAP bulk financial archives from workflow run {os.environ['SOURCE_RUN_ID']}.\n\n"
              f"Acquisition code head: {os.environ['SOURCE_HEAD_SHA']}\n"
              f"Evidence commit: {os.environ['EVIDENCE_COMMIT']}\n\n"
              f"Current snapshot is complete: {p['public_byte_verified_count']}/{p['archive_count_expected']} raw ZIPs re-hashed against the acquisition receipt.\n"
              f"Preserved 2026-08-31 manifest exact matches: {p['manifest_exact_match_count']}/{p['archive_count_expected']}.\n"
              f"Recorded manifest drifts: {p['manifest_drift_count']} ({drift_names}).\n\n"
              "The 28 raw ZIP assets are published only so independent reviewers can download and hash the exact bytes themselves. "
              "The preserved 2026-08-31 manifest remains immutable. This release does NOT authorize semantic mapping, PIT materialization, or real 60-cutoff scoring.\n",
              encoding='utf-8',
          )
          PY
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$EVIDENCE_COMMIT" \
              --title "KAP bulk byte evidence — run $SOURCE_RUN_ID" \
              --notes-file "$notes_file" \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            evidence/raw/KAP_*.zip \
            evidence/public/public_byte_evidence.json \
            evidence/public/SHA256SUMS.observed \
            evidence/source/kap-bulk-acquisition-receipt.json
      - name: Verify public release assets
        run: |
          asset_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          echo "release_asset_count=$asset_count"
          test "$asset_count" -eq 31
