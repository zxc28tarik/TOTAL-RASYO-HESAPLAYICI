name: V24 Borsa Bulletin Path Discovery

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-borsa-bulletin-path-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook readers
        run: python -m pip install --disable-pip-version-check openpyxl pandas xlrd
      - name: Download and inspect official Borsa path registry
        run: |
          set -euo pipefail
          rm -rf artifacts_borsa_bulletin_paths
          mkdir -p artifacts_borsa_bulletin_paths/extracted
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://borsaistanbul.com/files/DataFilePaths.zip' \
            --output artifacts_borsa_bulletin_paths/DataFilePaths.zip
          unzip -t artifacts_borsa_bulletin_paths/DataFilePaths.zip
          unzip -o artifacts_borsa_bulletin_paths/DataFilePaths.zip -d artifacts_borsa_bulletin_paths/extracted
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, re
          from pathlib import Path
          import pandas as pd
          from openpyxl import load_workbook

          root=Path('artifacts_borsa_bulletin_paths')
          archive=root/'DataFilePaths.zip'
          files=sorted((root/'extracted').rglob('*'))
          files=[p for p in files if p.is_file()]
          rows=[]
          keywords=('bülten','bulten','bulletin','pay piyas','equity market','piyasa verileri','market data')

          for path in files:
              suffix=path.suffix.lower()
              try:
                  if suffix in ('.xlsx','.xlsm'):
                      wb=load_workbook(path, read_only=True, data_only=True)
                      for ws in wb.worksheets:
                          for idx,row in enumerate(ws.iter_rows(values_only=True), start=1):
                              vals=['' if v is None else str(v).strip() for v in row]
                              joined=' | '.join(vals)
                              low=joined.lower()
                              if any(k in low for k in keywords):
                                  rows.append({'file':path.name,'sheet':ws.title,'row':idx,'cells':vals,'joined':joined})
                  elif suffix=='.xls':
                      book=pd.ExcelFile(path)
                      for sheet in book.sheet_names:
                          frame=pd.read_excel(path,sheet_name=sheet,header=None,dtype=object)
                          for idx,series in frame.iterrows():
                              vals=['' if pd.isna(v) else str(v).strip() for v in series.tolist()]
                              joined=' | '.join(vals)
                              low=joined.lower()
                              if any(k in low for k in keywords):
                                  rows.append({'file':path.name,'sheet':sheet,'row':int(idx)+1,'cells':vals,'joined':joined})
              except Exception as exc:
                  rows.append({'file':path.name,'sheet':'ERROR','row':0,'cells':[],'joined':repr(exc)})

          # Keep path-like strings separately so the next resolver can probe exact official URLs.
          path_candidates=[]
          for r in rows:
              for cell in r['cells']:
                  s=str(cell).strip()
                  if not s: continue
                  if s.startswith(('http://','https://','/')) or re.search(r'\.(?:zip|csv|xlsx?|xls|txt)$',s,re.I):
                      path_candidates.append(s)
          path_candidates=list(dict.fromkeys(path_candidates))

          report={
              'contract':'V24_BORSA_BULLETIN_PATH_DISCOVERY_V1',
              'registry_url':'https://borsaistanbul.com/files/DataFilePaths.zip',
              'registry_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
              'extracted_files':[str(p.relative_to(root)) for p in files],
              'match_count':len(rows),
              'path_candidates':path_candidates,
              'matches':rows,
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with (root/'relevant_rows.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['file','sheet','row','joined'])
              for r in rows: w.writerow([r['file'],r['sheet'],r['row'],r['joined']])
          print(json.dumps({'registry_sha256':report['registry_sha256'],'match_count':len(rows),'path_candidates':path_candidates},ensure_ascii=False,indent=2))
          if not rows:
              raise RuntimeError('official Borsa path registry produced no bulletin/market-data matches')
          PY
          sha256sum artifacts_borsa_bulletin_paths/DataFilePaths.zip artifacts_borsa_bulletin_paths/report.json artifacts_borsa_bulletin_paths/relevant_rows.csv > artifacts_borsa_bulletin_paths/SHA256SUMS
      - name: Persist discovery evidence
        run: |
          set -euo pipefail
          dst='data/backtest_sources/borsa_bulletin_path_discovery'
          rm -rf "$dst"; mkdir -p "$dst"
          cp artifacts_borsa_bulletin_paths/report.json artifacts_borsa_bulletin_paths/relevant_rows.csv artifacts_borsa_bulletin_paths/SHA256SUMS "$dst/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m 'V24 data audit official Borsa daily bulletin paths'
            git push origin HEAD:v24-real-data-work
          fi
