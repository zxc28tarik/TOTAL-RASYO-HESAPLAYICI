name: V24 Historical Price Alias Resolution

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - 'data/backtest_sources/yahoo_discovery/**'
      - 'data/backtest_sources/bist_ticker_code_changes_2021-08_2026-08.csv'
      - 'src/analytics/historical_price_aliases.py'
      - 'tests/test_historical_price_aliases.py'
      - '.github/workflows/v24-historical-price-alias-resolution.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas yfinance pytest
      - name: Test alias resolver
        run: pytest -q tests/test_historical_price_aliases.py
      - name: Resolve historical ticker aliases and audit monthly member coverage
        run: |
          set -euo pipefail
          rm -rf artifacts_price_resolution
          mkdir -p artifacts_price_resolution
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, time
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          from src.analytics.historical_price_aliases import resolve_missing_ticker_prices
          from src.analytics.bist100_membership_export import build_bist100_membership_export

          ROOT=Path('data/backtest_sources')
          DISC=ROOT/'yahoo_discovery'
          START='2020-07-01'; END='2026-08-02'

          prices=pd.read_csv(DISC/'historical_member_prices_yahoo_2020-07_2026-08.csv.gz')
          summary=json.loads((DISC/'historical_member_yahoo_summary.json').read_text(encoding='utf-8'))
          lineage=pd.read_csv(ROOT/'bist_ticker_code_changes_2021-08_2026-08.csv')
          missing=[str(x).upper() for x in summary['missing_tickers']]
          if len(missing) != summary['missing_ticker_count']:
              raise RuntimeError('Yahoo discovery missing ticker contract mismatch')

          lin=lineage[lineage['old_ticker'].astype(str).str.upper().isin(missing)].copy()
          counts=lin.groupby(lin['old_ticker'].astype(str).str.upper()).size().to_dict()
          bad={t:counts.get(t,0) for t in missing if counts.get(t,0)!=1}
          if bad:
              raise RuntimeError(f'missing tickers do not have exactly one Borsa direct successor: {bad}')
          successors={str(r.old_ticker).upper():str(r.new_ticker).upper() for r in lin.itertuples(index=False)}
          direct_tickers=set(prices['ticker'].astype(str).str.upper())
          need_supp=sorted({new for new in successors.values() if new not in direct_tickers})

          def fetch_symbol(ticker: str) -> pd.DataFrame:
              symbol=f'{ticker}.IS'
              last=None
              for attempt in range(5):
                  try:
                      h=yf.Ticker(symbol).history(start=START,end=END,auto_adjust=False,actions=True,repair=False,raise_errors=True)
                      if h is None or h.empty:
                          raise RuntimeError('EMPTY')
                      h=h.reset_index()
                      datecol='Date' if 'Date' in h.columns else h.columns[0]
                      return pd.DataFrame({
                          'ticker':ticker,
                          'yahoo_symbol':symbol,
                          'trade_date':pd.to_datetime(h[datecol]).dt.date.astype(str),
                          'open':pd.to_numeric(h.get('Open'),errors='coerce'),
                          'high':pd.to_numeric(h.get('High'),errors='coerce'),
                          'low':pd.to_numeric(h.get('Low'),errors='coerce'),
                          'close':pd.to_numeric(h.get('Close'),errors='coerce'),
                          'adj_close':pd.to_numeric(h.get('Adj Close'),errors='coerce'),
                          'volume':pd.to_numeric(h.get('Volume'),errors='coerce'),
                      })
                  except Exception as exc:
                      last=repr(exc)
                      time.sleep(1.5*(attempt+1))
              raise RuntimeError(f'supplemental Yahoo fetch failed for {ticker}: {last}')

          supplemental=[]
          for ticker in need_supp:
              supplemental.append(fetch_symbol(ticker))
          supplemental_df=pd.concat(supplemental,ignore_index=True) if supplemental else pd.DataFrame(columns=prices.columns)
          supplemental_df.to_csv('artifacts_price_resolution/supplemental_successor_prices.csv.gz',index=False,compression='gzip')

          resolved,audit=resolve_missing_ticker_prices(
              prices,
              missing,
              lineage,
              supplemental_prices=supplemental_df,
          )
          resolved_tickers=set(resolved['ticker'].astype(str).str.upper())
          unresolved=sorted(set(missing)-resolved_tickers)
          if unresolved:
              raise RuntimeError(f'lineage alias resolution left missing target tickers: {unresolved}')

          audit.to_csv('artifacts_price_resolution/ticker_alias_audit.csv',index=False)
          resolved.to_csv('artifacts_price_resolution/historical_member_prices_resolved_2020-07_2026-08.csv.gz',index=False,compression='gzip')

          membership=build_bist100_membership_export(
              snapshot_csv=ROOT/'bist100_snapshot_2026-08-17.csv',
              periodic_json=ROOT/'bist100_periodic_events_2021Q3_2026Q3.json',
              nonperiodic_json=ROOT/'bist100_nonperiodic_events_2021-08_2026-08.json',
              ticker_lineage_csv=ROOT/'bist_ticker_code_changes_2021-08_2026-08.csv',
              signal_dates_csv=ROOT/'xu100_signal_dates_yahoo_2021-08_2026-07.csv',
              expected_months=60,
              expected_member_count=100,
          ).frame.copy()
          if len(membership)!=6000:
              raise RuntimeError(f'monthly membership row count != 6000: {len(membership)}')
          membership['signal_date']=pd.to_datetime(membership['signal_date']).dt.normalize()
          rp=resolved[['ticker','trade_date','open','close','price_source_ticker','price_resolution']].copy()
          rp['trade_date']=pd.to_datetime(rp['trade_date']).dt.normalize()
          cov=membership.merge(
              rp,
              left_on=['ticker','signal_date'],
              right_on=['ticker','trade_date'],
              how='left',
              validate='one_to_one',
          )
          cov['has_execution_price']=cov['open'].notna() & cov['close'].notna() & (cov['open']>0) & (cov['close']>0)
          cov.to_csv('artifacts_price_resolution/monthly_member_signal_price_coverage.csv',index=False)
          missing_pairs=cov[~cov['has_execution_price']][['month','signal_date','ticker']].copy()
          missing_pairs.to_csv('artifacts_price_resolution/monthly_member_missing_signal_prices.csv',index=False)

          alias_rows={str(r.old_ticker):int(r.recovered_rows) for r in audit.itertuples(index=False)}
          out={
              'contract':'V24_HISTORICAL_PRICE_RESOLUTION_V1',
              'discovery_contract':summary['contract'],
              'discovery_summary_sha256':hashlib.sha256((DISC/'historical_member_yahoo_summary.json').read_bytes()).hexdigest(),
              'direct_price_rows':int(len(prices)),
              'resolved_price_rows':int(len(resolved)),
              'original_missing_tickers':missing,
              'successor_map':successors,
              'supplemental_successors':need_supp,
              'alias_recovered_rows':alias_rows,
              'unresolved_tickers':unresolved,
              'monthly_membership_rows':int(len(membership)),
              'monthly_member_signal_price_rows_present':int(cov['has_execution_price'].sum()),
              'monthly_member_signal_price_rows_missing':int((~cov['has_execution_price']).sum()),
              'monthly_member_signal_price_missing_tickers':sorted(cov.loc[~cov['has_execution_price'],'ticker'].unique().tolist()),
              'workflow_head_sha':'${{ github.sha }}',
              'semantics':'No date shifting or forward fill. Old-code prices are successor Yahoo rows strictly before Borsa effective_date.',
          }
          Path('artifacts_price_resolution/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Hash resolution evidence
        run: find artifacts_price_resolution -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts_price_resolution/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: v24-historical-price-resolution
          path: artifacts_price_resolution/
          if-no-files-found: error
          retention-days: 90
      - name: Persist resolution evidence on branch
        run: |
          set -euo pipefail
          dst='data/backtest_sources/yahoo_resolved'
          rm -rf "$dst"
          mkdir -p "$dst"
          cp artifacts_price_resolution/* "$dst/"
          mv "$dst/summary.json" "$dst/historical_price_resolution_summary.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if git diff --cached --quiet; then
            echo 'No resolution evidence change.'
          else
            git commit -m 'V24 data freeze resolved historical Yahoo prices'
            git push origin HEAD:v24-real-data-work
          fi
