name: V24 KAP Public Financial PIT CI

on:
  push:
    branches:
      - codex/v24-kap-financial-pit-source
    paths:
      - 'src/ingest/api/kap_public_financials.py'
      - 'tests/test_kap_public_financials.py'
      - 'docs/HISTORICAL_FINANCIAL_PIT_SOURCE_PLAN.md'
      - '.github/workflows/v24-kap-public-financial-pit-ci.yml'
  pull_request:
    branches:
      - v24-real-data-work
    paths:
      - 'src/ingest/api/kap_public_financials.py'
      - 'tests/test_kap_public_financials.py'
      - 'docs/HISTORICAL_FINANCIAL_PIT_SOURCE_PLAN.md'
      - '.github/workflows/v24-kap-public-financial-pit-ci.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install 'requests>=2.31' 'beautifulsoup4>=4.12' pytest
      - name: Run public KAP financial client tests
        run: python -m pytest -q tests/test_kap_public_financials.py

  live-public-kap-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install 'requests>=2.31' 'beautifulsoup4>=4.12'
      - name: Prove public KAP list and detail endpoints with a real financial report
        run: |
          python - <<'PY'
          from datetime import date
          import json

          from src.ingest.api.kap_public_financials import (
              KapPublicFinancialClient,
              taxonomy_tags,
          )

          expected_index = 1598274
          expected_tag = 'kap-fr_StatementOfFinancialPositionBalanceSheetLineItems'

          client = KapPublicFinancialClient(
              timeout_seconds=45,
              max_retries=4,
              min_request_interval_seconds=0.75,
          )
          reports = client.list_financial_reports(
              date(2026, 4, 28),
              date(2026, 4, 28),
              ticker_filter={'GARFA'},
          )
          matching = [row for row in reports if row.disclosure_index == expected_index]
          if len(matching) != 1:
              raise RuntimeError(
                  f'expected real GARFA financial report {expected_index}; '
                  f'found indexes={[row.disclosure_index for row in reports]}'
              )
          summary = matching[0]
          detail = client.fetch_detail(summary)
          tags = taxonomy_tags(detail)
          if expected_tag not in tags:
              raise RuntimeError(
                  f'real KAP detail missing expected balance-sheet taxonomy tag; '
                  f'tag_count={len(tags)}'
              )
          if summary.published_at.isoformat() != '2026-04-28T18:17:10+03:00':
              raise RuntimeError(f'unexpected real publish time: {summary.published_at.isoformat()}')
          print(json.dumps({
              'source': 'KAP_PUBLIC_DISCLOSURE_API',
              'ticker': 'GARFA',
              'disclosure_index': detail.disclosure_index,
              'published_at': detail.published_at.isoformat(),
              'summary_sha256': summary.raw_sha256,
              'detail_sha256': detail.raw_sha256,
              'taxonomy_tag_count': len(tags),
              'expected_taxonomy_tag_present': True,
          }, ensure_ascii=False, sort_keys=True))
          PY
