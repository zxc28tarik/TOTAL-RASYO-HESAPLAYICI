name: V24 KAP Bank Schema Targeted Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - codex/p1-kap-semantic-family-coverage
    paths:
      - 'scripts/discover_kap_bulk_bank_schema_targeted.py'
      - 'src/ingest/kap_bulk_semantic_adapter.py'
      - 'src/ingest/kap_bulk_bank_exact_semantic_mapping.py'
      - 'tests/test_kap_bulk_bank_schema_targeted.py'
      - 'tests/test_kap_bulk_bank_exact_semantic_mapping.py'
      - '.github/workflows/v24-kap-bank-schema-targeted-discovery.yml'

permissions:
  contents: read

jobs:
  discover-bank-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: 'kap-bulk-byte-evidence-run-33568804543'
      PUBLIC_EVIDENCE: 'data/backtest_sources/kap_bulk_financial_source_capture/public_byte_evidence/run_33568804543.json'
      SHA256SUMS_OBSERVED: 'data/backtest_sources/kap_bulk_financial_source_capture/public_byte_evidence/SHA256SUMS.run_33568804543.observed'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Targeted BANK discovery and semantic unit guards
        run: |
          python -m pytest -q \
            tests/test_kap_bulk_bank_schema_targeted.py \
            tests/test_kap_bulk_schema_discovery.py \
            tests/test_kap_bulk_current_snapshot_discovery.py \
            tests/test_kap_bulk_bank_exact_semantic_mapping.py
      - name: Download exact public release raw ZIP assets
        run: |
          mkdir -p kap-current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'KAP_*.zip' --dir kap-current
          test "$(find kap-current -maxdepth 1 -type f -name 'KAP_*.zip' | wc -l)" -eq 28
      - name: Re-verify exact public release bytes
        run: |
          (cd kap-current && sha256sum -c "$GITHUB_WORKSPACE/$SHA256SUMS_OBSERVED")
      - name: Run targeted BANK and participation-bank discovery
        run: |
          mapfile -t archives < <(find kap-current -maxdepth 1 -type f -name 'KAP_*.zip' | sort)
          args=()
          for archive in "${archives[@]}"; do
            args+=(--archive "$archive")
          done
          python -m scripts.discover_kap_bulk_bank_schema_targeted \
            "${args[@]}" \
            --scan-archive-name KAP_2021_3A.zip \
            --public-evidence "$PUBLIC_EVIDENCE" \
            --output kap-current-bank-schema-targeted.json
      - name: Enforce discovery-only authorization boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('kap-current-bank-schema-targeted.json').read_text())
          assert result['contract'] == 'KAP_BULK_BANK_SCHEMA_TARGETED_DISCOVERY_CURRENT_SNAPSHOT_V1'
          assert result['archive_count'] == 28
          assert result['scanned_archive_count'] == 1
          assert result['scanned_archive_names'] == ['KAP_2021_3A.zip']
          assert result['full_archive_schema_scan'] is False
          assert result['matched_bank_report_count'] > 0
          assert result['source_entity_count'] > 0
          assert result['fact_identity_count'] > 0
          assert set(result['role_namespaces']) == {'banks', 'par-banks'}
          assert result['current_snapshot_public_evidence_verified'] is True
          assert result['preserved_manifest_exact_match_count'] == 26
          assert result['preserved_manifest_drift_count'] == 2
          assert result['preserved_manifest_drift_filenames'] == ['KAP_2025_Y.zip', 'KAP_2026_6A.zip']
          assert result['semantic_mapping_authorized'] is False
          assert result['pit_materialization_authorized'] is False
          assert result['real_60_cutoff_scoring_authorized'] is False
          print('scanned_archive_names=', result['scanned_archive_names'])
          print('matched_bank_report_count=', result['matched_bank_report_count'])
          print('source_entity_count=', result['source_entity_count'])
          print('role_count=', result['role_count'])
          print('fact_identity_count=', result['fact_identity_count'])
          print('role_namespaces=', result['role_namespaces'])
          PY
      - name: Real KAP BANK semantic mapping regression
        run: |
          python - <<'PY'
          from datetime import timedelta
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          from src.ingest.api.semantic_facts import SemanticFactMapper
          from src.ingest.kap_bulk_bank_exact_semantic_mapping import build_bulk_exact_bank_semantic_config
          from src.ingest.kap_bulk_financial_export import parse_kap_bulk_export_report, parse_kap_bulk_financial_cells
          from src.ingest.kap_bulk_semantic_adapter import bulk_cells_to_financial_facts, bulk_context_dimensions

          archive = Path('kap-current/KAP_2021_3A.zip')
          archive_bytes = archive.read_bytes()
          archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          mapper = SemanticFactMapper(build_bulk_exact_bank_semantic_config())
          required = {'TOTAL_EQUITY', 'ISSUED_CAPITAL', 'NET_INCOME'}
          cases = [('AKBNK', 'AKBNK_'), ('ALBRK', 'ALBRK-ALK_')]
          evidence = {'archive': archive.name, 'archive_sha256': archive_sha, 'cases': []}
          dividend_evidence = []

          with ZipFile(archive) as bundle:
              names = bundle.namelist()
              for ticker, prefix in cases:
                  candidates = sorted(
                      name for name in names
                      if name.startswith(prefix) and name.endswith('_2021_1.xls')
                  )
                  assert candidates, f'{ticker} 2021Q1 real KAP member bulunamadi'
                  successful = []
                  for member in candidates:
                      raw = bundle.read(member)
                      report = parse_kap_bulk_export_report(
                          archive_name=archive.name,
                          archive_sha256=archive_sha,
                          member_name=member,
                          raw_html=raw,
                      )
                      cells = parse_kap_bulk_financial_cells(report, raw)
                      facts = bulk_cells_to_financial_facts(
                          report, cells, ticker=ticker,
                          extracted_at=report.published_at + timedelta(minutes=1),
                      )
                      semantic = mapper.map_facts(
                          facts, mapped_at=report.published_at + timedelta(minutes=2)
                      )
                      fields = {row.canonical_field for row in semantic}
                      if required.issubset(fields):
                          successful.append({
                              'member': member,
                              'notification_id': report.notification_id,
                              'statement_scope': report.statement_scope,
                              'semantic_fields': sorted(fields),
                          })
                      for cell in cells:
                          dims = bulk_context_dimensions(cell)
                          if (
                              cell.label_tr == 'Dağıtılan Temettü'
                              and cell.row_number == 39
                              and dims.get('context_period_side') == 'CURRENT'
                              and dims.get('context_period_kind') == 'YTD'
                              and dims.get('context_member') == 'Toplam Özkaynak'
                          ):
                              dividend_evidence.append({
                                  'ticker': ticker,
                                  'member': member,
                                  'role': cell.table_role,
                                  'row': cell.row_number,
                                  'label': cell.label_tr,
                                  'context': cell.context_label,
                              })
                              assert 'DIVIDENDS_PAID' in fields
                  assert successful, f'{ticker} real KAP semantic core mapping PASS uretmedi'
                  evidence['cases'].append({'ticker': ticker, 'successful': successful})

          assert dividend_evidence, '2021Q1 verified BANK/participation archive current Toplam Özkaynak temettu kaniti uretmedi'
          evidence['dividend_evidence'] = dividend_evidence
          evidence['result'] = 'PASS'
          Path('kap-real-bank-semantic-regression.json').write_text(
              json.dumps(evidence, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload targeted BANK technical schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: kap-current-bank-schema-targeted-${{ github.sha }}
          path: |
            kap-current-bank-schema-targeted.json
            kap-real-bank-semantic-regression.json
          if-no-files-found: error
          retention-days: 90
