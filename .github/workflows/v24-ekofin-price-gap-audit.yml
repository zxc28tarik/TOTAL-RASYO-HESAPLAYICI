name: V24 Ekofin Price Gap Audit

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-ekofin-price-gap-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas
      - name: Discover Ekofin historical contract and exact rows
        run: |
          set -euo pipefail
          rm -rf artifacts_ekofin_gap; mkdir -p artifacts_ekofin_gap
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,re,time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          import pandas as pd

          TARGETS={
            'INVES': ['2022-07-01','2022-08-01','2022-09-01'],
            'KLRHO': ['2023-01-02','2023-02-01','2023-03-01','2023-04-03','2023-05-02','2023-06-01'],
            'ASGYO': ['2024-01-02','2024-02-01','2024-03-01'],
          }
          BASE='https://ekofin.net/sirket/detay/{ticker}/tarihsel-veriler'
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept-Language':'tr-TR,tr;q=0.9,en;q=0.8',
            'Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
          })

          MONTHS={'Ocak':1,'Şubat':2,'Subat':2,'Mart':3,'Nisan':4,'Mayıs':5,'Mayis':5,'Haziran':6,'Temmuz':7,'Ağustos':8,'Agustos':8,'Eylül':9,'Eylul':9,'Ekim':10,'Kasım':11,'Kasim':11,'Aralık':12,'Aralik':12}
          def parse_day(text):
              raw=re.sub(r'\s+',' ',str(text or '')).strip()
              try: return pd.to_datetime(raw,dayfirst=True,errors='raise').date().isoformat()
              except Exception: pass
              m=re.search(r'(\d{1,2})\s+([A-Za-zÇĞİÖŞÜçğıöşü]+)\s+(\d{4})',raw)
              if m and m.group(2) in MONTHS:
                  return f'{int(m.group(3)):04d}-{MONTHS[m.group(2)]:02d}-{int(m.group(1)):02d}'
              return None

          def num(text):
              raw=str(text or '').strip().replace('\xa0',' ')
              raw=re.sub(r'[^0-9,.-]','',raw)
              if not raw: return None
              # Ekofin historical pages use dot decimal in indexed examples; keep
              # a conservative Turkish-comma fallback.
              if ',' in raw and '.' not in raw: raw=raw.replace(',','.')
              elif ',' in raw and '.' in raw: raw=raw.replace('.','').replace(',','.')
              try: return float(raw)
              except Exception: return None

          def parse_tables(html,ticker,source_url,sha,target_dates):
              soup=BeautifulSoup(html,'html.parser')
              out=[]
              for table in soup.find_all('table'):
                  trs=table.find_all('tr')
                  if not trs: continue
                  header=[re.sub(r'\s+',' ',x.get_text(' ',strip=True)).strip().lower() for x in trs[0].find_all(['th','td'])]
                  joined='|'.join(header)
                  if not (('kapan' in joined or 'close' in joined) and ('açılış' in joined or 'acilis' in joined or 'open' in joined)):
                      continue
                  # derive column positions from labels rather than assuming order
                  def idx(keys):
                      for i,h in enumerate(header):
                          if any(k in h for k in keys): return i
                      return None
                  di=idx(['tarih','date']); ci=idx(['kapan','close']); oi=idx(['açılış','acilis','open']); hi=idx(['yüksek','yuksek','high']); li=idx(['düşük','dusuk','low']); vi=idx(['hacim','volume'])
                  if None in (di,ci,oi): continue
                  for tr in trs[1:]:
                      cells=[re.sub(r'\s+',' ',x.get_text(' ',strip=True)).strip() for x in tr.find_all(['td','th'])]
                      if max(di,ci,oi)>=len(cells): continue
                      day=parse_day(cells[di])
                      if day not in target_dates: continue
                      row={'ticker':ticker,'trade_date':day,'open':num(cells[oi]),'close':num(cells[ci]),'high':num(cells[hi]) if hi is not None and hi<len(cells) else None,'low':num(cells[li]) if li is not None and li<len(cells) else None,'volume_text':cells[vi] if vi is not None and vi<len(cells) else None,'source_url':source_url,'source_sha256':sha,'mode':'HTML_TABLE'}
                      if row['open'] is not None and row['close'] is not None: out.append(row)
              return out

          reports={}; all_rows=[]; script_urls=set()
          for ticker,dates in TARGETS.items():
              base=BASE.format(ticker=ticker)
              # Probe common query conventions as well as the bare page.
              dmin=min(dates); dmax=max(dates)
              probes=[
                base,
                f'{base}?startDate={dmin}&endDate={dmax}',
                f'{base}?start_date={dmin}&end_date={dmax}',
                f'{base}?baslangic={dmin}&bitis={dmax}',
                f'{base}?from={dmin}&to={dmax}',
                f'{base}?start={dmin}&end={dmax}',
              ]
              page_probes=[]; found=[]
              for url in probes:
                  try:
                      r=s.get(url,timeout=45,allow_redirects=True)
                      sha=hashlib.sha256(r.content).hexdigest()
                      item={'url':url,'final_url':r.url,'status':r.status_code,'length':len(r.content),'sha256':sha}
                      if r.status_code==200:
                          rows=parse_tables(r.text,ticker,r.url,sha,set(dates)); item['target_rows']=rows; found.extend(rows)
                          soup=BeautifulSoup(r.text,'html.parser')
                          for tag in soup.find_all('script'):
                              src=tag.get('src')
                              if src: script_urls.add(urljoin(r.url,src))
                          if url==base:
                              Path(f'artifacts_ekofin_gap/{ticker}_page.html').write_text(r.text,encoding='utf-8')
                              anchors=[]; low=r.text.lower()
                              for needle in ['tarihsel','historical','startdate','enddate','baslangic','bitis','api/','fetch(','axios','datatable']:
                                  pos=0
                                  while True:
                                      p=low.find(needle.lower(),pos)
                                      if p<0: break
                                      anchors.append(r.text[max(0,p-800):min(len(r.text),p+1800)]); pos=p+len(needle)
                              item['anchors']=anchors[:80]
                      page_probes.append(item)
                  except Exception as exc:
                      page_probes.append({'url':url,'error':repr(exc)})
                  time.sleep(.15)
              reports[ticker]={'target_dates':dates,'page_probes':page_probes,'found':found}
              all_rows.extend(found)

          # Inspect JS for API/path names, then probe URL-looking candidates.
          js_hits={}; candidate_urls=[]
          for i,url in enumerate(sorted(script_urls)):
              try:
                  rr=s.get(url,timeout=45)
                  if rr.status_code!=200: continue
                  text=rr.text
                  hits=[]
                  for pat in [r'[^\"\']{0,100}tarihsel[^\"\']{0,300}',r'[^\"\']{0,100}historical[^\"\']{0,300}',r'/(?:api|ajax)/[^\"\'\s]{1,240}',r'https?://[^\"\'\s]{1,300}']:
                      hits.extend(re.findall(pat,text,re.I))
                  if hits:
                      js_hits[url]=list(dict.fromkeys(hits))[:100]
                      Path(f'artifacts_ekofin_gap/script_{i}.js').write_text(text,encoding='utf-8')
                      for h in hits:
                          for m in re.findall(r'(?:https?://[^\"\'<>\s]+|/[A-Za-z0-9_./?=&%:{}-]+)',str(h)):
                              if any(k in m.lower() for k in ('tarih','histor','api','price','fiyat')):
                                  candidate_urls.append(urljoin('https://ekofin.net/',m))
              except Exception as exc:
                  js_hits[url]=[f'FETCH_ERROR:{exc!r}']
          reports['script_hits']=js_hits
          reports['candidate_urls']=list(dict.fromkeys(candidate_urls))[:200]

          # Exact rows may appear through query probes; require consistency.
          df=pd.DataFrame(all_rows)
          conflicts=[]; chosen=[]
          if not df.empty:
              for (ticker,day),g in df.groupby(['ticker','trade_date']):
                  vals=g[['open','close','high','low']].drop_duplicates()
                  if len(vals)>1: conflicts.append({'ticker':ticker,'trade_date':day,'rows':g.to_dict('records')})
                  else: chosen.append(g.iloc[0].to_dict())
          exact=pd.DataFrame(chosen)
          expected={(t,d) for t,ds in TARGETS.items() for d in ds}
          got={(str(r.ticker),str(r.trade_date)) for r in exact.itertuples(index=False)} if not exact.empty else set()
          missing=sorted(expected-got)
          summary={'contract':'V24_EKOFIN_PRICE_GAP_AUDIT_V1','target_row_count':12,'exact_rows_found':len(got),'missing_pairs':[{'ticker':t,'trade_date':d} for t,d in missing],'conflict_count':len(conflicts),'accepted':len(got)==12 and len(conflicts)==0,'script_hit_count':len(js_hits),'candidate_url_count':len(reports['candidate_urls']),'note':'Secondary-source exact-day audit. No interpolation/date shifting/forward fill.'}
          reports['conflicts']=conflicts; reports['summary']=summary
          exact.to_csv('artifacts_ekofin_gap/exact_gap_prices.csv',index=False)
          Path('artifacts_ekofin_gap/report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('artifacts_ekofin_gap/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Hash evidence
        run: find artifacts_ekofin_gap -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts_ekofin_gap/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: v24-ekofin-price-gap-audit
          path: artifacts_ekofin_gap/
          if-no-files-found: error
          retention-days: 30
      - name: Persist compact evidence
        run: |
          set -euo pipefail
          dst='data/backtest_sources/ekofin_price_gap_audit'; rm -rf "$dst"; mkdir -p "$dst"
          cp artifacts_ekofin_gap/report.json "$dst/"
          cp artifacts_ekofin_gap/summary.json "$dst/"
          cp artifacts_ekofin_gap/exact_gap_prices.csv "$dst/"
          cp artifacts_ekofin_gap/SHA256SUMS "$dst/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m 'V24 data audit Ekofin exact historical price gaps'
            git push origin HEAD:v24-real-data-work
          fi
