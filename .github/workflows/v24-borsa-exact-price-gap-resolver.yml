name: V24 Borsa Exact Price Gap Resolver

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-borsa-exact-price-gap-resolver.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install readers
        run: python -m pip install --disable-pip-version-check requests pandas openpyxl xlrd
      - name: Probe official THB daily bulletin archives
        run: |
          set -euo pipefail
          rm -rf artifacts_borsa_exact_gap
          mkdir -p artifacts_borsa_exact_gap/raw
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, re, zipfile
          from pathlib import Path
          import pandas as pd
          import requests

          TARGETS={
            'INVES':['2022-07-01','2022-08-01','2022-09-01'],
            'KLRHO':['2023-01-02','2023-02-01','2023-03-01','2023-04-03','2023-05-02','2023-06-01'],
            'ASGYO':['2024-01-02','2024-02-01','2024-03-01'],
          }
          by_date={d:t for t,dates in TARGETS.items() for d in dates}
          root=Path('artifacts_borsa_exact_gap')
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          suffixes=['','0','1','2','3']
          probes=[]; archives=[]; hits=[]

          def sha(data:bytes)->str: return hashlib.sha256(data).hexdigest()
          def decode(data:bytes):
              for enc in ('utf-8-sig','cp1254','iso-8859-9','latin1'):
                  try: return data.decode(enc),enc
                  except UnicodeDecodeError: pass
              return data.decode('latin1','replace'),'latin1-replace'

          def record_text_hits(day,ticker,url,archive_sha,name,data):
              text,enc=decode(data)
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if ticker.upper() not in line.upper(): continue
                  lo=max(0,i-4); hi=min(len(lines),i+5)
                  hits.append({
                    'trade_date':day,'ticker':ticker,'archive_url':url,'archive_sha256':archive_sha,
                    'member':name,'member_sha256':sha(data),'encoding':enc,'line_no':i+1,
                    'context':lines[lo:hi],
                  })

          def record_excel_hits(day,ticker,url,archive_sha,name,data):
              suffix=Path(name).suffix.lower()
              engine='openpyxl' if suffix in ('.xlsx','.xlsm') else 'xlrd'
              try:
                  book=pd.ExcelFile(io.BytesIO(data),engine=engine)
              except Exception as exc:
                  hits.append({'trade_date':day,'ticker':ticker,'archive_url':url,'archive_sha256':archive_sha,'member':name,'excel_error':repr(exc)})
                  return
              for sheet in book.sheet_names:
                  try: frame=pd.read_excel(io.BytesIO(data),sheet_name=sheet,header=None,dtype=object,engine=engine)
                  except Exception: continue
                  mask=frame.apply(lambda col: col.astype(str).str.upper().str.contains(ticker.upper(),regex=False,na=False)).any(axis=1)
                  for idx in frame.index[mask]:
                      lo=max(0,int(idx)-3); hi=min(len(frame),int(idx)+4)
                      rows=[]
                      for _,r in frame.iloc[lo:hi].iterrows(): rows.append(['' if pd.isna(v) else str(v) for v in r.tolist()])
                      hits.append({'trade_date':day,'ticker':ticker,'archive_url':url,'archive_sha256':archive_sha,'member':name,'sheet':sheet,'row_no':int(idx)+1,'context_rows':rows})

          for day,ticker in sorted(by_date.items()):
              y,m,d=day.split('-'); ymd=y+m+d
              base=f'https://borsaistanbul.com/data/thb/{y}/{m}/'
              found_for_day=[]
              for suff in suffixes:
                  filename=f'thb{ymd}{suff}.zip'
                  url=base+filename
                  try:
                      r=session.get(url,timeout=45,allow_redirects=True)
                      item={'trade_date':day,'ticker':ticker,'url':url,'final_url':r.url,'status':r.status_code,'length':len(r.content),'content_type':r.headers.get('Content-Type')}
                      if r.status_code==200 and r.content[:2]==b'PK':
                          item['sha256']=sha(r.content); item['valid_zip']=True
                          raw=root/'raw'/filename; raw.write_bytes(r.content)
                          with zipfile.ZipFile(io.BytesIO(r.content)) as z:
                              names=z.namelist(); item['members']=names
                              for name in names:
                                  if name.endswith('/'): continue
                                  data=z.read(name)
                                  low=Path(name).suffix.lower()
                                  if low in ('.csv','.txt','.tsv','.dat',''):
                                      record_text_hits(day,ticker,url,item['sha256'],name,data)
                                  elif low in ('.xlsx','.xlsm','.xls'):
                                      record_excel_hits(day,ticker,url,item['sha256'],name,data)
                          archives.append(item); found_for_day.append(filename)
                      probes.append(item)
                  except Exception as exc:
                      probes.append({'trade_date':day,'ticker':ticker,'url':url,'error':repr(exc)})
              if not found_for_day:
                  probes.append({'trade_date':day,'ticker':ticker,'result':'NO_VALID_THB_ARCHIVE_IN_SUFFIX_SET'})

          # Do not commit full Borsa archives; retain exact hashes/listings and ticker-local contexts only.
          summary={
            'contract':'V24_BORSA_EXACT_PRICE_GAP_DISCOVERY_V1',
            'path_contract':'/data/thb/YYYY/AA/ + thbYYYYAAGGS.zip',
            'target_count':sum(len(v) for v in TARGETS.values()),
            'valid_archive_count':len(archives),
            'target_days_with_valid_archive':len({a['trade_date'] for a in archives}),
            'ticker_hit_count':len(hits),
            'target_days_with_ticker_hit':len({h['trade_date'] for h in hits if 'line_no' in h or 'row_no' in h}),
          }
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'ticker_hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'archive_manifest.json').write_text(json.dumps(archives,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if summary['target_days_with_valid_archive']==0:
              raise RuntimeError('no valid official THB archive discovered; suffix/path contract needs expansion')
          PY
          sha256sum artifacts_borsa_exact_gap/summary.json artifacts_borsa_exact_gap/probes.json artifacts_borsa_exact_gap/ticker_hits.json artifacts_borsa_exact_gap/archive_manifest.json > artifacts_borsa_exact_gap/SHA256SUMS
      - name: Persist official discovery evidence
        run: |
          set -euo pipefail
          dst='data/backtest_sources/borsa_exact_price_gap_discovery'
          rm -rf "$dst"; mkdir -p "$dst"
          cp artifacts_borsa_exact_gap/summary.json artifacts_borsa_exact_gap/probes.json artifacts_borsa_exact_gap/ticker_hits.json artifacts_borsa_exact_gap/archive_manifest.json artifacts_borsa_exact_gap/SHA256SUMS "$dst/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m 'V24 data audit official Borsa exact price gaps'
            git push origin HEAD:v24-real-data-work
          fi
