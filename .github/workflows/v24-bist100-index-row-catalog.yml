name: V24 BIST100 Index Row Catalog

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-bist100-index-row-catalog.yml'

permissions:
  contents: read

jobs:
  catalog-index-announcement-rows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Extract official Benchmark Indices constituent-change catalog
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          URL='https://borsaistanbul.com/en/indices/index-announcements'
          START=datetime.strptime('2021-06-01','%Y-%m-%d').date()
          END=datetime.strptime('2026-08-31','%Y-%m-%d').date()
          r=requests.get(URL,headers={'User-Agent':'Mozilla/5.0 V24-historical-research/4.0'},timeout=40)
          r.raise_for_status()
          raw=r.content
          Path('artifacts/index_announcements.html').write_bytes(raw)
          soup=BeautifulSoup(raw,'html.parser')

          rows=[]
          for tr in soup.find_all('tr'):
              cells=[' '.join(c.stripped_strings).strip() for c in tr.find_all(['th','td'])]
              text=' | '.join(cells) if cells else ' '.join(tr.stripped_strings)
              dm=re.search(r'\b(\d{2})\.(\d{2})\.(\d{4})\b',text)
              if not dm:
                  continue
              day=datetime.strptime(dm.group(0),'%m.%d.%Y').date()
              if not (START <= day <= END):
                  continue
              if 'Index Constituents Changes' not in text or 'Benchmark Indices' not in text:
                  continue
              links=[]
              for a in tr.find_all('a',href=True):
                  label=' '.join(a.stripped_strings).strip()
                  links.append({'label':label,'href':urljoin(r.url,a['href'])})
              title=''
              for c in cells:
                  if 'Index Constituents Changes' in c:
                      title=c
                      break
              if not title:
                  title=' '.join(tr.stripped_strings).strip()
              rows.append({
                  'announcement_date':day.isoformat(),
                  'announcement_type':'PERIODIC' if '(Periodic)' in text else 'NON_PERIODIC',
                  'category':'Benchmark Indices',
                  'title':title,
                  'row_text':text,
                  'links':links,
              })

          # Stable de-duplication by date/type/title/links.
          unique=[]; seen=set()
          for row in sorted(rows,key=lambda x:(x['announcement_date'],x['announcement_type'],x['title'])):
              key=(row['announcement_date'],row['announcement_type'],row['title'],tuple((x['label'],x['href']) for x in row['links']))
              if key in seen: continue
              seen.add(key); unique.append(row)

          periodic=[x for x in unique if x['announcement_type']=='PERIODIC']
          nonperiodic=[x for x in unique if x['announcement_type']=='NON_PERIODIC']
          payload={
              'source':'Borsa Istanbul Index Announcements',
              'source_url':URL,
              'source_final_url':r.url,
              'source_raw_sha256':hashlib.sha256(raw).hexdigest(),
              'window':{'start':START.isoformat(),'end':END.isoformat()},
              'benchmark_constituent_change_count':len(unique),
              'periodic_count':len(periodic),
              'nonperiodic_count':len(nonperiodic),
              'rows':unique,
          }
          Path('artifacts/bist100_index_row_catalog.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with Path('artifacts/bist100_index_row_catalog.tsv').open('w',encoding='utf-8') as f:
              f.write('date\ttype\ttitle\tlinks\n')
              for x in unique:
                  link_text=' || '.join(f"{a['label']} => {a['href']}" for a in x['links'])
                  f.write(f"{x['announcement_date']}\t{x['announcement_type']}\t{x['title'].replace(chr(9),' ')}\t{link_text.replace(chr(9),' ')}\n")
          summary={k:payload[k] for k in ('benchmark_constituent_change_count','periodic_count','nonperiodic_count','source_raw_sha256')}
          print(json.dumps(summary,indent=2))
          print(Path('artifacts/bist100_index_row_catalog.tsv').read_text(encoding='utf-8'))
          if len(periodic) < 20:
              raise RuntimeError(f'periodic catalog unexpectedly small: {len(periodic)}')
          PY
      - name: Hash catalog
        run: sha256sum artifacts/index_announcements.html artifacts/bist100_index_row_catalog.json artifacts/bist100_index_row_catalog.tsv > artifacts/SHA256SUMS
      - name: Upload catalog evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-bist100-index-row-catalog
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
