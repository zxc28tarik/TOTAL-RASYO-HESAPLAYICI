name: V24 BIST100 Periodic Event Proof

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - '.github/workflows/v24-bist100-periodic-proof.yml'

permissions:
  contents: read

jobs:
  prove-periodic-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Download 21 official Borsa pages and verify extracted BIST100 events
        run: |
          mkdir -p artifacts/pages
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          EVENTS = [
            {
              'quarter':'2021Q3','announcement_date':'2021-06-18','effective_date':'2021-07-01',
              'url':'https://borsaistanbul.com/en/announcement/12664/borsa-istanbul-announces-constituent-changes-bist-stock-indices-third-quarter-2021',
              'included':['AFYON','BRYAT','ENKAI','ERBOS','GLYHO','GSRAY','HDFGS','LOGO','RTALB','VESBE'],
              'excluded':['AKSGY','BUCIM','GOODY','GSDHO','HLGYO','MAVI','POLHO','TATGD','TUKAS','YATAS'],
            },
            {
              'quarter':'2021Q4','announcement_date':'2021-09-16','effective_date':'2021-10-01',
              'url':'https://borsaistanbul.com/en/announcement/14213/borsa-istanbul-announces-constituent-changes-bist-stock-indices-fourth-quarter-2021',
              'included':['AGHOL','AKCNS','ARDYZ','AYDEM','AYGAZ','BIOEN','CANTE','HLGYO','ISDMR','IZMDC','MAVI','QUAGR','SARKY','TMSN','TRILC','YATAS','ZRGYO'],
              'excluded':['AFYON','BRSAN','BRYAT','CEMAS','ECZYT','EGGUB','FENER','GSRAY','HDFGS','IHLAS','IHLGM','IPEKE','JANTS','KONYA','NTHOL','NUHCM','RTALB'],
            },
            {
              'quarter':'2022Q1','announcement_date':'2021-12-17','effective_date':'2022-01-03',
              'url':'https://borsaistanbul.com/en/announcement/12771/borsa-istanbul-announces-constituent-changes-bist-stock-indices-first-quarter-2022',
              'included':['ADESE','BASGZ','BRYAT','CEMAS','GENIL','GESAN','IPEKE','NTHOL','RTALB'],
              'excluded':['AKCNS','ALBRK','AYGAZ','CEMTS','HLGYO','MPARK','NETAS','TMSN','TRILC'],
            },
            {
              'quarter':'2022Q2','announcement_date':'2022-03-22','effective_date':'2022-04-01',
              'url':'https://borsaistanbul.com/en/announcement/14347/borsa-istanbul-announces-constituent-changes-bist-stock-indices-second-quarter-2022',
              'included':['ARASE','GSDHO','GWIND','JANTS','KONTR','KUTPO','KZBGY','NUGYO','SNGYO','TRILC'],
              'excluded':['ADESE','CEMAS','GESAN','IZMDC','KERVT','KRVGD','RTALB','SARKY','VERUS','YATAS'],
            },
            {
              'quarter':'2022Q3','announcement_date':'2022-06-21','effective_date':'2022-07-01',
              'url':'https://borsaistanbul.com/en/announcement/14401/borsa-istanbul-announces-constituent-changes-bist-stock-indices-third-quarter-2022',
              'included':['AKFGY','ALBRK','BAGFS','BUCIM','CEMTS','INVES','PSGYO','YATAS'],
              'excluded':['ARASE','BIOEN','BRISA','CANTE','ESEN','KARTN','KUTPO','KZBGY'],
            },
            {
              'quarter':'2022Q4','announcement_date':'2022-09-21','effective_date':'2022-10-03',
              'url':'https://borsaistanbul.com/en/announcement/12960/borsa-istanbul-announces-constituent-changes-bist-stock-indices-fourth-quarter-2022',
              'included':['GESAN','KARTN','PRKAB','SMRTG','TMSN','TSPOR','TUKAS','YYLGD'],
              'excluded':['ARDYZ','INDES','INVES','PARSN','TKNSA','TRILC','ZOREN','ZRGYO'],
            },
            {
              'quarter':'2023Q1','announcement_date':'2022-12-19','effective_date':'2023-01-02',
              'url':'https://borsaistanbul.com/en/announcement/14476/borsa-istanbul-announces-constituent-changes-bist-stock-indices-first-quarter-2023',
              'included':['ASUZU','BIOEN','EUREN','FENER','KCAER','KERVT','KLRHO','KMPUR','KZBGY','TKNSA','ZOREN'],
              'excluded':['GOZDE','DEVA','GENIL','ISMEN','KARTN','LOGO','NUGYO','PRKAB','QUAGR','TRGYO','YATAS'],
            },
            {
              'quarter':'2023Q2','announcement_date':'2023-03-16','effective_date':'2023-04-03',
              'url':'https://borsaistanbul.com/en/announcement/14516/borsa-istanbul-announces-constituent-changes-bist-stock-indices-second-quarter-2023',
              'included':['ALFAS','GENIL','IZMDC','KONYA','ULUUN'],
              'excluded':['ALGYO','ISFIN','JANTS','NTHOL','TSPOR'],
            },
            {
              'quarter':'2023Q3','announcement_date':'2023-06-16','effective_date':'2023-07-03',
              'url':'https://borsaistanbul.com/en/announcement/14545/borsa-istanbul-announces-constituent-changes-bist-stock-indices-third-quarter-2023',
              'included':['AHGAZ','AKCNS','ASTOR','BRSAN','CANTE','ECZYT','ISMEN','PENTA','QUAGR'],
              'excluded':['ALKIM','BASGZ','ERBOS','FENER','KERVT','KLRHO','TMSN','TURSG','ULUUN'],
            },
            {
              'quarter':'2023Q4','announcement_date':'2023-09-21','effective_date':'2023-10-02',
              'url':'https://borsaistanbul.com/en/announcement/13125/borsa-istanbul-announces-constituent-changes-bist-stock-indices-fourth-quarter-2023',
              'included':['AKFYE','BIENY','CWENE','EUPWR','IMASM','KAYSE','MIATK','YEOTK'],
              'excluded':['ASUZU','AYDEM','BAGFS','BIOEN','CEMTS','GSDHO','SELEC','TKNSA'],
            },
            {
              'quarter':'2024Q1','announcement_date':'2023-12-22','effective_date':'2024-01-02',
              'url':'https://borsaistanbul.com/en/announcement/14627/borsa-istanbul-announces-constituent-changes-bist-stock-indices-first-quarter-2024',
              'included':['ASGYO','BIOEN','BOBET','ENERY','IZENR','KLSER','SDTTR','TATEN'],
              'excluded':['AKFGY','GENIL','GLYHO','IMASM','KZBGY','PSGYO','SNGYO','VESBE'],
            },
            {
              'quarter':'2024Q2','announcement_date':'2024-03-21','effective_date':'2024-04-01',
              'url':'https://borsaistanbul.com/en/announcement/14654/borsa-istanbul-announces-constituent-changes-bist-stock-indices-second-quarter-2024',
              'included':['AGROT','AKFGY','ANSGR','BFREN','BTCIM','REEDR','SAYAS','TABGD','TURSG','VESBE'],
              'excluded':['AGHOL','ASGYO','BUCIM','ISDMR','IZMDC','KARSN','KMPUR','KORDS','PENTA','TATEN'],
            },
            {
              'quarter':'2024Q3','announcement_date':'2024-06-13','effective_date':'2024-07-01',
              'url':'https://borsaistanbul.com/en/announcement/14682/borsa-istanbul-announces-constituent-changes-bist-stock-indices-third-quarter-2024',
              'included':['AGHOL','ARDYZ','BINHO','GOLTS','KTLEV','LMKDC','OBAMS','PEKGY','TKNSA','TMSN'],
              'excluded':['AHGAZ','AKCNS','ALBRK','ANSGR','BIENY','BIOEN','BOBET','GWIND','IPEKE','SAYAS'],
            },
            {
              'quarter':'2024Q4','announcement_date':'2024-09-20','effective_date':'2024-10-01',
              'url':'https://borsaistanbul.com/en/announcement/14707/borsa-istanbul-announces-constituent-changes-bist-stock-indices-fourth-quarter-2024',
              'included':['ADEL','ALTNY','ANSGR','BJKAS','CLEBI','FENER','KARSN','MPARK','PAPIL','RGYAS'],
              'excluded':['BFREN','ECZYT','EUREN','ISGYO','IZENR','KAYSE','QUAGR','SDTTR','TKNSA','YYLGD'],
            },
            {
              'quarter':'2025Q1','announcement_date':'2024-12-20','effective_date':'2025-01-02',
              'url':'https://borsaistanbul.com/en/announcement/13287/borsa-istanbul-announces-constituent-changes-bist-stock-indices-first-quarter-2025',
              'included':['ANHYT','BSOKE','CVKMD','IEYHO','LIDER','MAGEN','NTHOL','PASEU','SDTTR','SELEC','TSPOR'],
              'excluded':['ADEL','AKFGY','BINHO','BJKAS','KTLEV','LMKDC','OBAMS','PAPIL','PEKGY','RGYAS','VESBE'],
            },
            {
              'quarter':'2025Q2','announcement_date':'2025-03-21','effective_date':'2025-04-02',
              'url':'https://borsaistanbul.com/en/announcement/14784/borsa-istanbul-announces-constituent-changes-bist-stock-indices-second-quarter-2025',
              'included':['AHGAZ','AVPGY','EFORC','GRTHO','GSRAY','KTLEV','LMKDC','OBAMS','RALYH','RYGYO'],
              'excluded':['AKFYE','CVKMD','FENER','KLSER','LIDER','NTHOL','SDTTR','TMSN','TSPOR','TUKAS'],
            },
            {
              'quarter':'2025Q3','announcement_date':'2025-06-20','effective_date':'2025-07-01',
              'url':'https://borsaistanbul.com/en/announcement/15121/borsa-istanbul-announces-constituent-changes-bist-stock-indices-third-quarter-2025',
              'included':['BALSU','BINHO','DSTKF','FENER','GENIL','GLRMK','GRSEL','IPEKE','KUYAS','TUREX'],
              'excluded':['AGROT','AHGAZ','ANHYT','ARDYZ','ECILC','GOLTS','KARSN','KONYA','RYGYO','SELEC'],
            },
            {
              'quarter':'2025Q4','announcement_date':'2025-09-12','effective_date':'2025-10-01',
              'url':'https://borsaistanbul.com/en/announcement/15220/borsa-istanbul-announces-constituent-changes-bist-stock-indices-fourth-quarter-2025',
              'included':['DAPGM','ECILC','PATEK','TSPOR','TUKAS'],
              'excluded':['ALFAS','AVPGY','BERA','LMKDC','SMRTG'],
            },
            {
              'quarter':'2026Q1','announcement_date':'2025-12-19','effective_date':'2026-01-02',
              'url':'https://borsaistanbul.com/en/announcement/15293/borsa-istanbul-announces-constituent-changes-bist-stock-indices-first-quarter-2026',
              'included':['IZENR','KLRHO','QUAGR'],
              'excluded':['BINHO','CLEBI','IEYHO'],
            },
            {
              'quarter':'2026Q2','announcement_date':'2026-03-19','effective_date':'2026-04-01',
              'url':'https://borsaistanbul.com/en/announcement/15392/borsa-istanbul-announces-constituent-changes-bist-stock-indices-second-quarter-2026',
              'included':['CVKMD','EUREN','PAHOL','PSGYO','SARKY'],
              'excluded':['EGEEN','KCAER','TSPOR','TTRAK','YEOTK'],
            },
            {
              'quarter':'2026Q3','announcement_date':'2026-06-19','effective_date':'2026-07-01',
              'url':'https://borsaistanbul.com/en/announcement/15483/bist-stock-indices-periodic-review',
              'included':['ESEN','IEYHO','ODINE'],
              'excluded':['AGHOL','TABGD','TUREX'],
            },
          ]

          HEADERS={'User-Agent':'Mozilla/5.0 V24-historical-research/5.0'}

          def fetch(url):
              last=None
              for attempt in range(4):
                  try:
                      r=requests.get(url,headers=HEADERS,timeout=35)
                      r.raise_for_status()
                      return r.content,r.url
                  except Exception as exc:
                      last=exc
                      time.sleep(1.0*(attempt+1))
              raise RuntimeError(f'fetch failed {url}: {last}')

          proved=[]
          for idx,event in enumerate(EVENTS):
              if len(event['included']) != len(event['excluded']):
                  raise RuntimeError(f"{event['quarter']}: member count is not preserved")
              if set(event['included']) & set(event['excluded']):
                  raise RuntimeError(f"{event['quarter']}: include/exclude overlap")
              raw,final=fetch(event['url'])
              digest=hashlib.sha256(raw).hexdigest()
              soup=BeautifulSoup(raw,'html.parser')
              text=' '.join(soup.stripped_strings)
              upper=text.upper()
              if 'BIST 100' not in upper:
                  raise RuntimeError(f"{event['quarter']}: source page does not mention BIST 100")
              missing=[ticker for ticker in event['included']+event['excluded'] if not re.search(rf'(?<![A-Z0-9]){re.escape(ticker)}(?![A-Z0-9])',upper)]
              if missing:
                  raise RuntimeError(f"{event['quarter']}: expected tickers absent from source page: {missing}")
              page_name=f"{idx+1:02d}_{event['quarter']}.html"
              Path('artifacts/pages',page_name).write_bytes(raw)
              proved.append({
                  **event,
                  'source_final_url':final,
                  'source_sha256':digest,
                  'source_page_file':f'pages/{page_name}',
                  'event_type':'PERIODIC_CONSTITUENT_CHANGE',
                  'effective_date_semantics':'FIRST_XU100_TRADING_DAY_OF_PERIOD',
              })

          if len(proved) != 21:
              raise RuntimeError(f'expected 21 periodic event groups, got {len(proved)}')
          payload={
              'publisher':'Borsa Istanbul A.S.',
              'event_group_count':len(proved),
              'first_quarter':proved[0]['quarter'],
              'last_quarter':proved[-1]['quarter'],
              'events':proved,
          }
          Path('artifacts/bist100_periodic_events_proved.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with Path('artifacts/bist100_periodic_events_proved.tsv').open('w',encoding='utf-8') as f:
              f.write('quarter\tannouncement_date\teffective_date\tincluded\texcluded\tsource_url\tsource_sha256\n')
              for e in proved:
                  f.write(
                    f"{e['quarter']}\t{e['announcement_date']}\t{e['effective_date']}\t"
                    f"{','.join(e['included'])}\t{','.join(e['excluded'])}\t{e['source_final_url']}\t{e['source_sha256']}\n"
                  )
          print(json.dumps({
              'event_group_count':len(proved),
              'replacement_pair_count':sum(len(e['included']) for e in proved),
              'first_effective_date':proved[0]['effective_date'],
              'last_effective_date':proved[-1]['effective_date'],
          },indent=2))
          print(Path('artifacts/bist100_periodic_events_proved.tsv').read_text(encoding='utf-8'))
          PY
      - name: Hash proof output
        run: sha256sum artifacts/bist100_periodic_events_proved.json artifacts/bist100_periodic_events_proved.tsv > artifacts/SHA256SUMS
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: v24-bist100-periodic-event-proof
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
