name: V24 BIST100 Nonperiodic Targeted Audit

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - 'data/backtest_sources/bist100_nonperiodic_kap_catalog_2023-09_2026-08.json'
      - '.github/workflows/v24-bist100-nonperiodic-targeted-audit.yml'

permissions:
  contents: read

jobs:
  audit-114-catalog-rows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Audit all 114 official non-periodic catalog disclosures
        run: |
          set -euo pipefail
          mkdir -p artifacts/raw_details
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time, unicodedata
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          BASE='https://www.kap.org.tr'
          BORSA_OID='4028e4a14bcf2a06014be4d7e6e256b6'
          catalog=json.loads(Path('data/backtest_sources/bist100_nonperiodic_kap_catalog_2023-09_2026-08.json').read_text(encoding='utf-8'))
          if catalog.get('row_count') != 114 or len(catalog.get('rows',[])) != 114:
              raise RuntimeError('official nonperiodic catalog must contain exactly 114 rows')

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; TotalRasyoTargetedAudit/1.0)','Accept':'application/json, text/plain, */*','Referer':BASE+'/tr/bildirim-sorgu'})

          def request(url: str):
              last=None
              for attempt in range(7):
                  r=s.get(url,timeout=60)
                  last=r
                  if r.status_code != 429 and r.status_code < 500:
                      return r
                  delay=min(20.0,1.5*(2**attempt))
                  try:
                      if r.headers.get('Retry-After'):
                          delay=max(delay,float(r.headers['Retry-After']))
                  except ValueError:
                      pass
                  time.sleep(delay)
              return last

          def norm(value: object) -> str:
              raw=unicodedata.normalize('NFKD',str(value or ''))
              raw=''.join(ch for ch in raw if not unicodedata.combining(ch))
              return re.sub(r'\s+',' ',raw).strip().upper()

          warm=request(BASE+'/tr/bildirim-sorgu')
          warm.raise_for_status()
          time.sleep(0.5)

          audited=[]
          failures=[]
          for pos,row in enumerate(catalog['rows'],1):
              idx=int(row['kap_id'])
              r=request(BASE+f'/tr/api/notification/attachment-detail/{idx}')
              if r is None or r.status_code != 200:
                  failures.append({'kap_id':idx,'status':None if r is None else r.status_code})
                  continue
              raw=r.content
              sha=hashlib.sha256(raw).hexdigest()
              Path(f'artifacts/raw_details/{idx}.json').write_bytes(raw)
              try:
                  obj=r.json(); root=obj[0] if isinstance(obj,list) and obj else obj
                  disclosure=root['disclosure']; basic=disclosure['disclosureBasic']; body=root.get('disclosureBody',[])
              except Exception as exc:
                  failures.append({'kap_id':idx,'parse_error':repr(exc)})
                  continue
              if basic.get('companyTitle') != 'BORSA İSTANBUL A.Ş.' or basic.get('mkkMemberOid') != BORSA_OID:
                  raise RuntimeError(f'KAP {idx} filer identity mismatch')
              html='\n'.join(body if isinstance(body,list) else [str(body)])
              soup=BeautifulSoup(html,'html.parser')
              plain=' '.join(soup.stripped_strings)
              normalized=norm(plain)
              xrows=[]
              for tr in soup.find_all('tr'):
                  cells=[' '.join(c.stripped_strings) for c in tr.find_all(['td','th'])]
                  if cells and any('XU100' in norm(c) for c in cells):
                      xrows.append(cells)
              explicit=('XU100' in normalized or 'BIST 100' in normalized)
              audited.append({
                  'announcement_date':row['announcement_date'],
                  'disclosureIndex':idx,
                  'publishDate':basic.get('publishDate'),
                  'title':basic.get('title'),
                  'summary':basic.get('summary'),
                  'relatedStocks':basic.get('relatedStocks'),
                  'catalog_title':row['title'],
                  'source_url':BASE+f'/tr/Bildirim/{idx}',
                  'source_detail_sha256':sha,
                  'explicit_xu100':bool(explicit),
                  'xu100_table_rows':xrows,
                  'plain_text':plain,
              })
              time.sleep(0.12)

          if failures:
              Path('artifacts/failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              raise RuntimeError(f'{len(failures)} of 114 KAP details could not be audited')
          if len(audited) != 114:
              raise RuntimeError(f'audited row count != 114: {len(audited)}')
          explicit=[x for x in audited if x['explicit_xu100']]
          if not any(x['disclosureIndex']==1618229 for x in explicit):
              raise RuntimeError('known XU100 replacement KAP 1618229 not detected')
          payload={
              'publisher':'KAP / Borsa Istanbul A.S.',
              'catalog_contract':catalog['contract'],
              'catalog_source_raw_sha256':catalog['source_raw_sha256'],
              'audited_count':len(audited),
              'explicit_xu100_count':len(explicit),
              'explicit_xu100':explicit,
          }
          Path('artifacts/targeted_nonperiodic_xu100_audit.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('artifacts/targeted_all_114_details.json').write_text(json.dumps(audited,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k!='explicit_xu100'},ensure_ascii=False,indent=2))
          for item in explicit:
              print(json.dumps({k:item[k] for k in ('disclosureIndex','publishDate','title','summary','relatedStocks','source_detail_sha256','xu100_table_rows')},ensure_ascii=False))
          PY
      - name: Hash evidence
        run: find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: v24-bist100-nonperiodic-targeted-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
