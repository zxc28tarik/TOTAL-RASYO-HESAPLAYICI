name: V24 KAP Insurance Finance 2021Q1 Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - codex/p1-kap-semantic-family-coverage
    paths:
      - 'src/ingest/kap_bulk_insurance_finance_exact_semantic_mapping.py'
      - 'scripts/discover_kap_bulk_insurance_finance_schema_targeted.py'
      - 'tests/test_kap_bulk_insurance_finance_exact_semantic_mapping.py'
      - 'tests/test_kap_bulk_insurance_finance_schema_targeted.py'
      - '.github/workflows/v24-kap-insurance-finance-schema-2021q1.yml'

permissions:
  contents: read

jobs:
  discover-2021q1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: 'kap-bulk-byte-evidence-run-33568804543'
      PUBLIC_EVIDENCE: 'data/backtest_sources/kap_bulk_financial_source_capture/public_byte_evidence/run_33568804543.json'
      SHA256SUMS_OBSERVED: 'data/backtest_sources/kap_bulk_financial_source_capture/public_byte_evidence/SHA256SUMS.run_33568804543.observed'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Quick discovery and semantic guards
        run: |
          python -m pytest -q \
            tests/test_kap_bulk_insurance_finance_schema_targeted.py \
            tests/test_kap_bulk_insurance_finance_exact_semantic_mapping.py
      - name: Download exact public release raw ZIP assets
        run: |
          mkdir -p kap-current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'KAP_*.zip' --dir kap-current
          test "$(find kap-current -maxdepth 1 -type f -name 'KAP_*.zip' | wc -l)" -eq 28
      - name: Re-verify exact public release bytes
        run: (cd kap-current && sha256sum -c "$GITHUB_WORKSPACE/$SHA256SUMS_OBSERVED")
      - name: Discover verified 2021Q1 INSURANCE FINANCE schema
        run: |
          mapfile -t archives < <(find kap-current -maxdepth 1 -type f -name 'KAP_*.zip' | sort)
          args=()
          for archive in "${archives[@]}"; do args+=(--archive "$archive"); done
          python -m scripts.discover_kap_bulk_insurance_finance_schema_targeted \
            "${args[@]}" \
            --scan-archive-name KAP_2021_3A.zip \
            --public-evidence "$PUBLIC_EVIDENCE" \
            --output kap-2021q1-insurance-finance-schema.json
      - name: Enforce discovery-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('kap-2021q1-insurance-finance-schema.json').read_text())
          assert result['archive_count'] == 28
          assert result['scanned_archive_count'] == 1
          assert result['scanned_archive_names'] == ['KAP_2021_3A.zip']
          assert result['full_archive_schema_scan'] is False
          assert result['matched_insurance_finance_report_count'] == 17
          assert result['source_entity_count'] == 13
          assert set(result['role_namespaces']) == {'insurance', 'finance'}
          assert result['semantic_mapping_authorized'] is False
          assert result['pit_materialization_authorized'] is False
          assert result['real_60_cutoff_scoring_authorized'] is False
          PY
      - name: Real KAP INSURANCE FINANCE semantic mapping regression
        run: |
          python - <<'PY'
          from datetime import timedelta
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          from src.ingest.api.semantic_facts import SemanticFactMapper
          from src.ingest.kap_bulk_financial_export import parse_kap_bulk_export_report, parse_kap_bulk_financial_cells
          from src.ingest.kap_bulk_insurance_finance_exact_semantic_mapping import (
              build_bulk_exact_financial_semantic_config,
              build_bulk_exact_insurance_semantic_config,
          )
          from src.ingest.kap_bulk_semantic_adapter import bulk_cells_to_financial_facts

          archive = Path('kap-current/KAP_2021_3A.zip')
          archive_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          insurance_mapper = SemanticFactMapper(build_bulk_exact_insurance_semantic_config())
          financial_mapper = SemanticFactMapper(build_bulk_exact_financial_semantic_config())
          cases = [
              ('ANSGR', 'INSURANCE', {
                  'TOTAL_EQUITY', 'ISSUED_CAPITAL', 'NET_INCOME',
                  'WRITTEN_PREMIUMS_NON_LIFE', 'TECHNICAL_RESULT_TOTAL', 'INVESTMENT_INCOME',
              }),
              ('ANHYT', 'INSURANCE', {
                  'TOTAL_EQUITY', 'ISSUED_CAPITAL', 'NET_INCOME',
                  'WRITTEN_PREMIUMS_LIFE', 'TECHNICAL_RESULT_TOTAL', 'INVESTMENT_INCOME',
              }),
              ('CRDFA', 'FINANCIAL', {
                  'TOTAL_ASSETS', 'TOTAL_EQUITY', 'ISSUED_CAPITAL', 'NET_INCOME',
                  'FACTORING_RECEIVABLES', 'NET_FINANCE_INCOME', 'FUNDING_COSTS', 'OPERATING_EXPENSES',
              }),
              ('ISFIN', 'FINANCIAL', {
                  'TOTAL_ASSETS', 'TOTAL_EQUITY', 'ISSUED_CAPITAL', 'NET_INCOME',
                  'LEASING_RECEIVABLES_NET', 'NET_FINANCE_INCOME', 'FUNDING_COSTS', 'OPERATING_EXPENSES',
              }),
          ]
          evidence = {'archive': archive.name, 'archive_sha256': archive_sha, 'cases': []}
          with ZipFile(archive) as bundle:
              names = bundle.namelist()
              for ticker, family, required in cases:
                  candidates = sorted(
                      name for name in names
                      if name.startswith(f'{ticker}_') and name.endswith('_2021_1.xls')
                  )
                  assert candidates, f'{ticker} 2021Q1 real KAP member bulunamadi'
                  successful = []
                  for member in candidates:
                      raw = bundle.read(member)
                      report = parse_kap_bulk_export_report(
                          archive_name=archive.name,
                          archive_sha256=archive_sha,
                          member_name=member,
                          raw_html=raw,
                      )
                      cells = parse_kap_bulk_financial_cells(report, raw)
                      facts = bulk_cells_to_financial_facts(
                          report, cells, ticker=ticker,
                          extracted_at=report.published_at + timedelta(minutes=1),
                      )
                      mapper = insurance_mapper if family == 'INSURANCE' else financial_mapper
                      semantic = mapper.map_facts(
                          facts, mapped_at=report.published_at + timedelta(minutes=2)
                      )
                      fields = {row.canonical_field for row in semantic}
                      if required.issubset(fields):
                          successful.append({
                              'member': member,
                              'notification_id': report.notification_id,
                              'statement_scope': report.statement_scope,
                              'semantic_fields': sorted(fields),
                          })
                  assert successful, f'{ticker} real KAP {family} semantic core mapping PASS uretmedi'
                  evidence['cases'].append({
                      'ticker': ticker, 'family': family,
                      'required_fields': sorted(required), 'successful': successful,
                  })

          evidence['result'] = 'PASS'
          Path('kap-real-insurance-finance-semantic-regression.json').write_text(
              json.dumps(evidence, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload 2021Q1 INSURANCE FINANCE evidence
        uses: actions/upload-artifact@v4
        with:
          name: kap-2021q1-insurance-finance-schema-${{ github.sha }}
          path: |
            kap-2021q1-insurance-finance-schema.json
            kap-real-insurance-finance-semantic-regression.json
          if-no-files-found: error
          retention-days: 90
