name: V24 Real Data CI

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - 'src/analytics/historical_backtest_inventory.py'
      - 'src/analytics/historical_backtest_corporate_actions.py'
      - 'src/analytics/historical_backtest_corporate_action_events.py'
      - 'src/analytics/historical_backtest_signal_dates.py'
      - 'src/analytics/historical_price_supplement.py'
      - 'src/analytics/historical_pit_ratio_replay.py'
      - 'src/analytics/historical_pit_rsc_replay.py'
      - 'src/analytics/bist100_membership_history.py'
      - 'src/analytics/bist100_membership_pipeline.py'
      - 'src/analytics/bist100_periodic_events.py'
      - 'src/analytics/bist100_nonperiodic_events.py'
      - 'src/analytics/bist100_membership_export.py'
      - 'src/analytics/ticker_lineage.py'
      - 'config/ratios.json'
      - 'config/sectors.json'
      - 'scripts/inventory_historical_backtest_inputs.py'
      - 'scripts/audit_historical_price_adjustments.py'
      - 'scripts/export_historical_signal_dates.py'
      - 'scripts/export_bist100_membership_history.py'
      - 'data/backtest_sources/minimum_wage_csgb_2021_2026.csv'
      - 'data/backtest_sources/historical_universe_borsaistanbul_manifest.json'
      - 'data/backtest_sources/xu100_signal_dates_yahoo_2021-08_2026-07.csv'
      - 'data/backtest_sources/xu100_signal_dates_yahoo_2021-08_2026-07.provenance.json'
      - 'data/backtest_sources/bist100_snapshot_2026-08-17.csv'
      - 'data/backtest_sources/bist100_snapshot_2026-08-17.provenance.json'
      - 'data/backtest_sources/bist_ticker_code_changes_2021-08_2026-08.csv'
      - 'data/backtest_sources/bist_ticker_code_changes_2021-08_2026-08.provenance.json'
      - 'data/backtest_sources/bist100_periodic_events_2021Q3_2026Q3.json'
      - 'data/backtest_sources/bist100_nonperiodic_events_2021-08_2026-08.json'
      - 'data/backtest_sources/borsa_exact_price_gap_discovery/thb_schema_proof.json'
      - 'data/backtest_sources/yahoo_resolved/monthly_member_signal_price_coverage.csv'
      - 'data/backtest_sources/yahoo_resolved/monthly_member_missing_signal_prices.csv'
      - 'tests/test_historical_backtest_inventory.py'
      - 'tests/test_historical_backtest_inventory_db_live.py'
      - 'tests/test_historical_backtest_corporate_actions.py'
      - 'tests/test_historical_backtest_corporate_action_events.py'
      - 'tests/test_historical_backtest_signal_dates.py'
      - 'tests/test_historical_price_supplement.py'
      - 'tests/test_historical_pit_ratio_replay.py'
      - 'tests/test_historical_pit_rsc_replay.py'
      - 'tests/test_bist100_membership_history.py'
      - 'tests/test_bist100_membership_pipeline.py'
      - 'tests/test_bist100_nonperiodic_events.py'
      - 'tests/test_bist100_membership_export.py'
      - 'tests/test_ticker_lineage.py'
      - 'tests/test_v24_real_bist100_periodic_events_source.py'
      - 'tests/test_v24_real_minimum_wage_source.py'
      - 'tests/test_v24_real_historical_universe_source_manifest.py'
      - 'tests/test_v24_real_xu100_signal_dates_source.py'
      - 'tests/test_v24_real_bist100_snapshot_source.py'
      - '.github/workflows/v24-real-data-ci.yml'
  pull_request:
    branches: [v24-real-data-work]
    paths:
      - 'src/analytics/historical_price_supplement.py'
      - 'src/analytics/historical_pit_ratio_replay.py'
      - 'src/analytics/historical_pit_rsc_replay.py'
      - 'config/ratios.json'
      - 'config/sectors.json'
      - 'data/backtest_sources/borsa_exact_price_gap_discovery/thb_schema_proof.json'
      - 'data/backtest_sources/yahoo_resolved/monthly_member_signal_price_coverage.csv'
      - 'data/backtest_sources/yahoo_resolved/monthly_member_missing_signal_prices.csv'
      - 'tests/test_historical_price_supplement.py'
      - 'tests/test_historical_pit_ratio_replay.py'
      - 'tests/test_historical_pit_rsc_replay.py'
      - '.github/workflows/v24-real-data-ci.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: total_rasyo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d total_rasyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: total_rasyo_test
      TOTAL_RASYO_TEST_DSN: postgresql://postgres:postgres@localhost:5432/total_rasyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply schema
        run: make core migrate
      - name: V24 real-data preflight contracts
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=v24-real-targeted.xml \
            tests/test_historical_backtest_inventory.py \
            tests/test_historical_backtest_inventory_db_live.py \
            tests/test_historical_backtest_corporate_actions.py \
            tests/test_historical_backtest_corporate_action_events.py \
            tests/test_historical_backtest_signal_dates.py \
            tests/test_historical_price_supplement.py \
            tests/test_historical_pit_ratio_replay.py \
            tests/test_historical_pit_rsc_replay.py \
            tests/test_bist100_membership_history.py \
            tests/test_bist100_membership_pipeline.py \
            tests/test_bist100_nonperiodic_events.py \
            tests/test_bist100_membership_export.py \
            tests/test_ticker_lineage.py \
            tests/test_v24_real_bist100_periodic_events_source.py \
            tests/test_v24_real_minimum_wage_source.py \
            tests/test_v24_real_historical_universe_source_manifest.py \
            tests/test_v24_real_xu100_signal_dates_source.py \
            tests/test_v24_real_bist100_snapshot_source.py | tee v24-real-targeted.log
      - name: Full regression
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=v24-real-full.xml | tee v24-real-full.log
      - name: BANK v4.7 regression
        run: |
          set -o pipefail
          make test-bank-v47 | tee v24-real-bank.log
      - name: Persist passing V24 real-data evidence
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, xml.etree.ElementTree as ET
          from pathlib import Path

          def junit_counts(path):
              root = ET.parse(path).getroot()
              if root.tag == 'testsuite':
                  nodes = [root]
              else:
                  nodes = list(root.findall('testsuite'))
              if not nodes:
                  raise RuntimeError(f'no junit testsuite in {path}')
              return {
                  'tests': sum(int(x.attrib.get('tests', 0)) for x in nodes),
                  'failures': sum(int(x.attrib.get('failures', 0)) for x in nodes),
                  'errors': sum(int(x.attrib.get('errors', 0)) for x in nodes),
                  'skipped': sum(int(x.attrib.get('skipped', 0)) for x in nodes),
              }

          targeted = junit_counts('v24-real-targeted.xml')
          full = junit_counts('v24-real-full.xml')
          if targeted['failures'] or targeted['errors'] or full['failures'] or full['errors']:
              raise RuntimeError('cannot persist failing CI evidence')
          bank_log = Path('v24-real-bank.log').read_text(encoding='utf-8', errors='replace')
          m = re.search(r'(\d+) passed,\s*(\d+) xfailed', bank_log)
          if not m:
              raise RuntimeError('BANK v4.7 summary missing')

          evidence = {
              'contract': 'V24_REAL_DATA_CI_EVIDENCE_V1',
              'tested_commit_sha': os.environ['GITHUB_SHA'],
              'schema_migration': 'PASSED',
              'targeted': targeted,
              'full_regression': full,
              'bank_v47': {'passed': int(m.group(1)), 'xfailed': int(m.group(2))},
              'exact_signal_price_contract': {
                  'monthly_member_rows': 6000,
                  'official_borsa_thb_supplements': 12,
                  'remaining_execution_price_gaps': 0,
                  'overwrite_existing_yahoo_prices': False,
                  'thb_schema_evolution': 'AUDITED_DYNAMIC_COLUMN_COUNT',
              },
              'pit_ratio_replay': {'core_and_val': 'PIT_SAFE'},
              'pit_rsc_replay': {
                  'database_read_path': False,
                  'input': 'HistoricalPitRatioReplayResult.combined_ratios',
                  'result': 'PASS',
              },
              'result': 'PASS',
          }
          dst = Path('docs/V24_REAL_DATA_CI_EVIDENCE.json')
          dst.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/V24_REAL_DATA_CI_EVIDENCE.json
          git commit -m 'Record V24 real-data CI evidence'
          git push origin HEAD:v24-real-data-work
