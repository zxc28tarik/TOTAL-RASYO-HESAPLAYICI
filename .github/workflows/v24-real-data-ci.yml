name: V24 Real Data CI

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - 'src/analytics/historical_backtest_inventory.py'
      - 'src/analytics/historical_backtest_corporate_actions.py'
      - 'src/analytics/historical_backtest_signal_dates.py'
      - 'src/analytics/bist100_membership_history.py'
      - 'scripts/inventory_historical_backtest_inputs.py'
      - 'scripts/audit_historical_price_adjustments.py'
      - 'scripts/export_historical_signal_dates.py'
      - 'data/backtest_sources/minimum_wage_csgb_2021_2026.csv'
      - 'data/backtest_sources/historical_universe_borsaistanbul_manifest.json'
      - 'data/backtest_sources/xu100_signal_dates_yahoo_2021-08_2026-07.csv'
      - 'data/backtest_sources/xu100_signal_dates_yahoo_2021-08_2026-07.provenance.json'
      - 'data/backtest_sources/bist100_snapshot_2026-08-17.csv'
      - 'data/backtest_sources/bist100_snapshot_2026-08-17.provenance.json'
      - 'tests/test_historical_backtest_inventory.py'
      - 'tests/test_historical_backtest_inventory_db_live.py'
      - 'tests/test_historical_backtest_corporate_actions.py'
      - 'tests/test_historical_backtest_signal_dates.py'
      - 'tests/test_bist100_membership_history.py'
      - 'tests/test_v24_real_minimum_wage_source.py'
      - 'tests/test_v24_real_historical_universe_source_manifest.py'
      - 'tests/test_v24_real_xu100_signal_dates_source.py'
      - 'tests/test_v24_real_bist100_snapshot_source.py'
      - '.github/workflows/v24-real-data-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: total_rasyo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d total_rasyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: total_rasyo_test
      TOTAL_RASYO_TEST_DSN: postgresql://postgres:postgres@localhost:5432/total_rasyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply schema
        run: make core migrate
      - name: V24 real-data preflight contracts
        run: >-
          python -m pytest -q
          tests/test_historical_backtest_inventory.py
          tests/test_historical_backtest_inventory_db_live.py
          tests/test_historical_backtest_corporate_actions.py
          tests/test_historical_backtest_signal_dates.py
          tests/test_bist100_membership_history.py
          tests/test_v24_real_minimum_wage_source.py
          tests/test_v24_real_historical_universe_source_manifest.py
          tests/test_v24_real_xu100_signal_dates_source.py
          tests/test_v24_real_bist100_snapshot_source.py
      - name: Full regression
        run: python -m pytest -q
      - name: BANK v4.7 regression
        run: make test-bank-v47
