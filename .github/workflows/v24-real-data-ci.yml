permissions:
  contents: write

jobs:
  pandas-22-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned pandas 2.2 compatibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'pandas==2.2.3' \
            'psycopg2-binary>=2.9' \
            pytest
      - name: Verify pinned versions
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd

          assert np.__version__ == '1.26.4', np.__version__
          assert pd.__version__ == '2.2.3', pd.__version__
          print(f'numpy={np.__version__} pandas={pd.__version__}')
          PY
      - name: Historical market modules and live compatibility on pandas 2.2.3
        run: |
          python -m pytest -q \
            tests/test_historical_pit_m3_replay.py \
            tests/test_betas_live_compatibility.py \
            tests/test_historical_m3_source_package.py \
            tests/test_real_historical_m3_source_package.py \
            tests/test_historical_pit_ek4_replay.py \
            tests/test_ek4_live_compatibility.py \
            tests/test_historical_pit_ek1_replay.py \
            tests/test_ek1_live_compatibility.py

  test:
    needs: pandas-22-compat
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: total_rasyo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d total_rasyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: total_rasyo_test
      TOTAL_RASYO_TEST_DSN: postgresql://postgres:postgres@localhost:5432/total_rasyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply schema
        run: make core migrate
      - name: V24 real-data preflight contracts
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=v24-real-targeted.xml \
            tests/test_historical_backtest_inventory.py \
            tests/test_historical_backtest_inventory_db_live.py \
            tests/test_historical_backtest_corporate_actions.py \
            tests/test_historical_backtest_corporate_action_events.py \
            tests/test_historical_backtest_signal_dates.py \
            tests/test_historical_price_supplement.py \
            tests/test_historical_pit_ratio_replay.py \
            tests/test_historical_pit_rsc_replay.py \
            tests/test_historical_pit_m1_replay.py \
            tests/test_historical_pit_m3_replay.py \
            tests/test_historical_m3_source_package.py \
            tests/test_real_historical_m3_source_package.py \
            tests/test_betas_live_compatibility.py \
            tests/test_historical_pit_ek4_replay.py \
            tests/test_ek4_live_compatibility.py \
            tests/test_historical_pit_ek1_replay.py \
            tests/test_ek1_live_compatibility.py \
            tests/test_historical_pit_nonfin_m2_replay.py \
            tests/test_historical_pit_holding_m2_replay.py \
            tests/test_historical_pit_gyo_m2_replay.py \
            tests/test_historical_pit_insurance_m2_replay.py \
            tests/test_historical_pit_financial_m2_replay.py \
            tests/test_historical_pit_bank_m2_replay.py \
            tests/test_bist100_membership_history.py \
            tests/test_bist100_membership_pipeline.py \
            tests/test_bist100_nonperiodic_events.py \
            tests/test_bist100_membership_export.py \
            tests/test_ticker_lineage.py \
            tests/test_v24_real_bist100_periodic_events_source.py \
            tests/test_v24_real_minimum_wage_source.py \
            tests/test_v24_real_historical_universe_source_manifest.py \
            tests/test_v24_real_xu100_signal_dates_source.py \
            tests/test_v24_real_bist100_snapshot_source.py | tee v24-real-targeted.log
      - name: Full regression
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=v24-real-full.xml | tee v24-real-full.log
      - name: BANK v4.7 regression
        run: |
          set -o pipefail
          make test-bank-v47 | tee v24-real-bank.log
      - name: Persist passing V24 real-data evidence
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, xml.etree.ElementTree as ET
          from pathlib import Path

          def junit_counts(path):
              root = ET.parse(path).getroot()
              if root.tag == 'testsuite':
                  nodes = [root]
              else:
                  nodes = list(root.findall('testsuite'))
              if not nodes:
                  raise RuntimeError(f'no junit testsuite in {path}')
              return {
                  'tests': sum(int(x.attrib.get('tests', 0)) for x in nodes),
                  'failures': sum(int(x.attrib.get('failures', 0)) for x in nodes),
                  'errors': sum(int(x.attrib.get('errors', 0)) for x in nodes),
                  'skipped': sum(int(x.attrib.get('skipped', 0)) for x in nodes),
              }

          targeted = junit_counts('v24-real-targeted.xml')
          full = junit_counts('v24-real-full.xml')
          if targeted['failures'] or targeted['errors'] or full['failures'] or full['errors']:
              raise RuntimeError('cannot persist failing CI evidence')
          bank_log = Path('v24-real-bank.log').read_text(encoding='utf-8', errors='replace')
          m = re.search(r'(\d+) passed,\s*(\d+) xfailed', bank_log)
          if not m:
              raise RuntimeError('BANK v4.7 summary missing')
          m3_manifest = json.loads(
              Path('data/backtest_sources/m3_source_package/manifest.json').read_text(
                  encoding='utf-8'
              )
          )
          if m3_manifest.get('package_status') != 'CLOSED':
              raise RuntimeError('historical M3 source package is not CLOSED')

          evidence = {
              'contract': 'V24_REAL_DATA_CI_EVIDENCE_V1',
              'tested_commit_sha': os.environ['GITHUB_SHA'],
              'schema_migration': 'PASSED',
              'targeted': targeted,
              'full_regression': full,
              'bank_v47': {'passed': int(m.group(1)), 'xfailed': int(m.group(2))},
              'exact_signal_price_contract': {
                  'monthly_member_rows': 6000,
                  'official_borsa_thb_supplements': 12,
                  'remaining_execution_price_gaps': 0,
                  'overwrite_existing_yahoo_prices': False,
                  'thb_schema_evolution': 'AUDITED_DYNAMIC_COLUMN_COUNT',
              },
              'pit_ratio_replay': {'core_and_val': 'PIT_SAFE'},
              'pit_rsc_replay': {
                  'database_read_path': False,
                  'input': 'HistoricalPitRatioReplayResult.combined_ratios',
                  'result': 'PASS',
              },
              'pit_m1_replay': {
                  'database_read_path': False,
                  'input': 'HistoricalPitRscReplayResult.rsc_summary',
                  'production_math': 'period_trend._slope/_trend_score/_trend_label',
                  'result': 'PASS',
              },
              'pit_m3_replay': {
                  'database_read_path': False,
                  'inputs': 'historical universe/calendar/stock prices/index prices',
                  'production_math': 'betas._ols_2f/compute_trailing_alpha_from_frames',
                  'window_trading_days': 63,
                  'post_market_cutoff_rejected': True,
                  'current_universe_fallback': False,
                  'score_rejection_coverage': 'EXHAUSTIVE',
                  'result': 'PASS',
              },
              'pit_m3_source_package': {
                  'contract': 'HISTORICAL_M3_SOURCE_PACKAGE_V1',
                  'raw_payload_required_for_closed': True,
                  'membership_route_rows_required': 6000,
                  'beta_lookback_trading_days': 252,
                  'xu100_sector_fallback': False,
                  'contract_tests': 'PASS',
                  'real_source_package_status': 'CLOSED',
                  'route_rows': m3_manifest['canonical_files']['sector_routes']['row_count'],
                  'index_close_rows': m3_manifest['canonical_files']['index_closes']['row_count'],
                  'raw_source_count': len(m3_manifest['raw_sources']),
                  'coverage': m3_manifest['coverage'],
                  'sector_routes_sha256': m3_manifest['canonical_files']['sector_routes']['sha256'],
                  'index_closes_sha256': m3_manifest['canonical_files']['index_closes']['sha256'],
              },
              'pit_ek4_replay': {
                  'database_read_path': False,
                  'inputs': 'historical routed universe/calendar/stock prices/index prices',
                  'sector_route_source': 'HISTORICAL_M3_SOURCE_PACKAGE_V1',
                  'production_math': 'ek4_momentum.compute_ek4_momentum_point',
                  'lookback_trading_intervals': 20,
                  'formula': 'stock_return-sector_return',
                  'post_market_cutoff_rejected': True,
                  'current_universe_fallback': False,
                  'xu100_sector_fallback': False,
                  'score_rejection_coverage': 'EXHAUSTIVE',
                  'result': 'PASS',
              },
              'pit_ek1_replay': {
                  'database_read_path': False,
                  'input': 'HistoricalPitM1ReplayResult',
                  'upstream': 'HistoricalPitRscReplayResult.rsc_summary',
                  'production_math': 'ek1_quality.compute_ek1_score_from_good_count',
                  'formula': 'clip(good_count_ge8/18,0,1)',
                  'same_period_as_m1_required': True,
                  'missing_good_count_default': False,
                  'veto_consumer': 'total_rasyo_score.compute_total_rasyo',
                  'veto_threshold': 5,
                  'veto_factor': 0.60,
                  'score_rejection_coverage': 'EXHAUSTIVE',
                  'result': 'PASS',
              },
              'pandas_compatibility': {
                  'pandas': '2.2.3',
                  'numpy': '1.26.4',
                  'tests': 'historical_market_and_quality_replays/live_compatibility/m3_source_package',
                  'result': 'PASS',
              },
              'pit_m2_replay': {
                  'NONFIN': {
                      'database_read_path': False,
                      'production_math': 'build_nonfin_snapshots_from_frames/evaluate_nonfin_batch',
                      'future_financial_price_follow_rejected': True,
                      'current_universe_fallback': False,
                      'result': 'PASS',
                  },
                  'HOLDING': {
                      'database_read_path': False,
                      'production_math': 'build_holding_snapshots_from_frames/evaluate_holding_batch',
                      'future_nav_price_follow_rejected': True,
                      'current_universe_fallback': False,
                      'm2_source': 'HOLDING_NAV_DISCOUNT_TWO_AXIS_V1',
                      'result': 'PASS',
                  },
                  'GYO': {
                      'database_read_path': False,
                      'production_math': 'build_gyo_snapshots_from_frames/evaluate_gyo_batch',
                      'future_nav_price_follow_rejected': True,
                      'current_universe_fallback': False,
                      'm2_source': 'GYO_PD_NAV_TWO_AXIS_V1',
                      'result': 'PASS',
                  },
                  'INSURANCE': {
                      'database_read_path': False,
                      'production_math': 'build_insurance_snapshots_from_frames/evaluate_insurance_batch',
                      'future_financial_price_follow_rejected': True,
                      'current_universe_fallback': False,
                      'result': 'PASS',
                  },
                  'FINANCIAL': {
                      'database_read_path': False,
                      'production_math': 'build_financial_institution_snapshots_from_frames/evaluate_financial_institution_batch',
                      'future_financial_price_follow_rejected': True,
                      'current_universe_fallback': False,
                      'result': 'PASS',
                  },
                  'BANK': {
                      'database_read_path': False,
                      'production_math': 'to_canonical_row/evaluate_bank_batch',
                      'future_financial_price_follow_rejected': True,
                      'current_universe_fallback': False,
                      'result': 'PASS',
                  },
                  'remaining_families': [],
              },
              'result': 'PASS',
          }
          dst = Path('docs/V24_REAL_DATA_CI_EVIDENCE.json')
          dst.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/V24_REAL_DATA_CI_EVIDENCE.json
          git commit -m 'Record V24 real-data CI evidence'
          git push origin HEAD:v24-real-data-work
