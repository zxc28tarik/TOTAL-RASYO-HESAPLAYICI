name: V24 KAP Bulk Route Probe

on:
  push:
    branches:
      - codex/p1-kap-semantic-family-coverage
    paths:
      - 'scripts/probe_kap_bulk_download_route.py'
      - 'tests/test_kap_bulk_download_route_probe.py'
      - '.github/workflows/v24-kap-bulk-route-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest
      - name: Probe unit contracts
        run: python -m pytest -q tests/test_kap_bulk_download_route_probe.py
      - name: Probe official KAP client routes
        id: probe
        continue-on-error: true
        run: |
          python scripts/probe_kap_bulk_download_route.py \
            --source-page https://kap.org.tr/tr \
            --output kap-bulk-route-probe.json \
            --require-candidates
      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kap-bulk-route-probe-${{ github.sha }}
          path: kap-bulk-route-probe.json
          if-no-files-found: warn
          retention-days: 7
      - name: Record external probe outcome
        if: always()
        run: |
          echo "probe_outcome=${{ steps.probe.outcome }}"
          if [ -f kap-bulk-route-probe.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('kap-bulk-route-probe.json').read_text(encoding='utf-8'))
          print('candidate_route_count=', len(p.get('candidate_routes', [])))
          for route in p.get('candidate_routes', []):
              print('candidate_route=', route)
          PY
          fi
