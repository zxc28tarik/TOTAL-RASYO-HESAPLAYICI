name: V24 Historical PIT Ratio CI

on:
  push:
    branches: [v24-real-data-work]
    paths:
      - 'src/analytics/historical_pit_ratio_replay.py'
      - 'src/analytics/val_ratios_pit.py'
      - 'src/analytics/company_ratio_pipeline.py'
      - 'tests/test_historical_pit_ratio_replay.py'
      - 'tests/test_val_ratios_pit.py'
      - 'tests/test_company_ratio_pipeline.py'
      - '.github/workflows/v24-historical-pit-ratio-ci.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest psycopg2-binary
      - name: Run PIT ratio foundation tests
        run: pytest -q tests/test_historical_pit_ratio_replay.py tests/test_val_ratios_pit.py tests/test_company_ratio_pipeline.py --junitxml=pit-ratio-junit.xml
      - name: Persist evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('pit-ratio-junit.xml').getroot()
          suite=root if root.tag=='testsuite' else root.find('testsuite')
          if suite is None: raise RuntimeError('testsuite missing')
          tests=int(suite.attrib.get('tests',0)); failures=int(suite.attrib.get('failures',0)); errors=int(suite.attrib.get('errors',0)); skipped=int(suite.attrib.get('skipped',0))
          if failures or errors or tests<=0: raise RuntimeError('PIT ratio evidence not clean')
          out={
            'contract':'V24_HISTORICAL_PIT_RATIO_TEST_EVIDENCE_V1',
            'source_head_sha':os.environ['GITHUB_SHA'],
            'tests':tests,'failures':failures,'errors':errors,'skipped':skipped,
            'test_files':['tests/test_historical_pit_ratio_replay.py','tests/test_val_ratios_pit.py','tests/test_company_ratio_pipeline.py'],
            'semantics':[
              'historical replay executes company CORE ratios at timezone-aware analysis_at',
              'historical replay executes six VAL ratios through val_ratios_pit at the same analysis_at',
              'CORE VAL leakage fails closed',
              'VAL unknown-ratio output fails closed',
              'routing-external tickers and duplicate ratio keys fail closed',
              'legacy run_ratios_calc valuation path is not used by the replay foundation',
            ],
          }
          dst=Path('data/backtest_sources/validation/historical_pit_ratio_ci.json'); dst.parent.mkdir(parents=True,exist_ok=True); dst.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backtest_sources/validation/historical_pit_ratio_ci.json
          if ! git diff --cached --quiet; then
            git commit -m 'V24 evidence historical PIT ratio tests'
            git push origin HEAD:v24-real-data-work
          fi
