name: V24A Snapshot Sync

on:
  push:
    branches: [v24a-action-sync]
    paths: [.v24a-sync-trigger]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify canonical V24-A snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .v24a-transfer/chunk_* | base64 -d > /tmp/v24a.tar.xz
          echo '428fbc8b234a8115a8928a15e0f2d3e38cd4b6ff26005c8416aa1349c28af485  /tmp/v24a.tar.xz' | sha256sum -c -
          xz -t /tmp/v24a.tar.xz
      - name: Replace main with latest snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v24a-src
          mkdir -p /tmp/v24a-src
          tar -xJf /tmp/v24a.tar.xz -C /tmp/v24a-src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan v24a-latest-snapshot
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v24a-src/. ./
          git add -A
          git commit -m 'V24-A latest snapshot'
          git push origin HEAD:main --force
