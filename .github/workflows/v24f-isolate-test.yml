name: V24F Isolate Live Fixture

on:
  push:
    branches: [v24f-ci]
    paths:
      - '.github/workflows/v24f-isolate-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v24f-ci
          fetch-depth: 0
      - name: Trigger V24-F CI on corrected fixture HEAD
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/ingest_backtest_schedule.py')
          s = p.read_text(encoding='utf-8')
          marker = '\n# V24-F temporary CI rerun marker; remove before merge.\n'
          if marker.strip() in s:
              raise SystemExit('rerun marker already present')
          p.write_text(s.rstrip() + marker, encoding='utf-8')
          PY
          git diff --check
      - name: Commit rerun marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ingest_backtest_schedule.py
          git commit -m 'V24-F trigger CI after live fixture isolation'
          git push origin HEAD:v24f-ci
