name: V24F Isolate Live Fixture

on:
  push:
    branches: [v24f-ci]
    paths:
      - '.github/workflows/v24f-isolate-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v24f-ci
          fetch-depth: 0
      - name: Ensure V24-E DB live test changes trigger V24-F CI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/v24f-ci.yml')
          s = p.read_text(encoding='utf-8')
          needle = '      - tests/test_historical_backtest_schedules_live.py\n'
          addition = needle + '      - tests/test_historical_backtest_db_live.py\n'
          if '      - tests/test_historical_backtest_db_live.py\n' in s:
              raise SystemExit('trigger already present; refusing duplicate')
          if s.count(needle) != 1:
              raise SystemExit('CI trigger anchor not unique')
          s = s.replace(needle, addition, 1)
          s = s.replace('# rerun after temporal fixture correction', '# rerun after fixture isolation', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/v24f-ci.yml
      - name: Commit CI trigger coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v24f-ci.yml
          git commit -m 'V24-F cover DB live fixture in CI trigger'
          git push origin HEAD:v24f-ci
