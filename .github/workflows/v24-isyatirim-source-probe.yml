name: V24 3Y Hybrid Financial Source Probe

on:
  push:
    branches:
      - codex/v24-isyatirim-3y-source-probe
    paths:
      - 'scripts/probe_isyatirim_financials.py'
      - 'scripts/probe_kap_financial_metadata.py'
      - '.github/workflows/v24-isyatirim-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch live İş Yatırım financial JSON and hash raw bytes
        run: python scripts/probe_isyatirim_financials.py
      - name: Probe low-volume KAP FR publication metadata
        run: python scripts/probe_kap_financial_metadata.py
      - name: Show manifests
        run: |
          cat artifacts/isyatirim_probe/manifest.json
          cat artifacts/kap_metadata_probe/manifest.json
      - name: Upload immutable hybrid probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-3y-financial-source-probe
          path: |
            artifacts/isyatirim_probe/
            artifacts/kap_metadata_probe/
          if-no-files-found: error
          retention-days: 14
